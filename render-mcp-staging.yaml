            "type": "pserv",
            "name": "skinharmony-mcp-staging-db-bootstrap",
            "envVarKey": "RENDER_GIT_COMMIT"
          }
        },
        {
          "key": "MCP_STAGING_UNIVERSAL_CORE_HOSTPORT",
          "fromService": {
            "type": "pserv",
            "name": "skinharmony-universal-core-staging",
            "property": "hostport"
          }
        },
        {
          "key": "MCP_STAGING_UNIVERSAL_CORE_KEY",
          "fromService": {
            "type": "web",
            "name": "skinharmony-core-mcp-staging",
            "envVarKey": "UNIVERSAL_CORE_KEY"
          }
        },
        {
          "key": "MCP_STAGING_CORE_ISSUER_HOSTPORT",
          "fromService": {
            "type": "pserv",
            "name": "skinharmony-core-staging-issuer",
            "property": "hostport"
          }
        },
        {
          "key": "MCP_STAGING_NYRA_ISSUER_HOSTPORT",
          "fromService": {
            "type": "pserv",
            "name": "skinharmony-nyra-staging-issuer",
            "property": "hostport"
          }
        },
        {
          "key": "MCP_STAGING_CORE_ISSUER_TOKEN",
          "fromService": {
            "type": "pserv",
            "name": "skinharmony-core-staging-issuer",
            "envVarKey": "MCP_STAGING_ISSUER_AUTH_TOKEN"
          }
        },
        {
          "key": "MCP_STAGING_NYRA_ISSUER_TOKEN",
          "fromService": {
            "type": "pserv",
            "name": "skinharmony-nyra-staging-issuer",
            "envVarKey": "MCP_STAGING_ISSUER_AUTH_TOKEN"
          }
        }
