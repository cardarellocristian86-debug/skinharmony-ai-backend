    {
      "type": "pserv",
      "name": "skinharmony-mcp-staging-db-bootstrap",
      "runtime": "node",
      "plan": "starter",
      "region": "oregon",
      "repo": "https://github.com/cardarellocristian86-debug/skinharmony-ai-backend",
      "branch": "agent/mcp-staging-shared-memory-release",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --prefix services/mcp-staging-db-bootstrap && npm ci --prefix services/skinharmony-core-mcp",
      "startCommand": "npm --prefix services/mcp-staging-db-bootstrap start",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "10001" },
        { "key": "MCP_STAGING_BOOTSTRAP_ENVIRONMENT", "value": "staging" },
        { "key": "MCP_STAGING_CONTROL_PLANE_PROFILE", "value": "collaboration" },
        { "key": "MCP_STAGING_DB_BOOTSTRAP_MODE", "value": "steady" },
        {
          "key": "PG_ADMIN_DATABASE_URL",
          "fromDatabase": {
            "name": "skinharmony-mcp-staging-db",
            "property": "connectionString"
          }
        },
        {
          "key": "PG_EXPECTED_DATABASE_NAME",
          "fromDatabase": {
            "name": "skinharmony-mcp-staging-db",
            "property": "database"
          }
        },
        { "key": "MCP_STAGING_GATE_CONTROL_PASSWORD", "generateValue": true },
        { "key": "MCP_STAGING_CORE_NONCE_API_TOKEN", "generateValue": true },
        { "key": "MCP_STAGING_NYRA_NONCE_API_TOKEN", "generateValue": true },
        { "key": "MCP_STAGING_RECEIPT_CONSUMER_API_TOKEN", "generateValue": true },
        {
          "key": "MCP_STAGING_DEPENDENCY_BUILD_COMMIT",
