{
  "projects": [
    {
      "name": "My project",
      "environments": [
        {
          "name": "staging",
          "services": [
    {
      "type": "pserv",
      "name": "skinharmony-mcp-staging-db-bootstrap",
      "runtime": "node",
      "plan": "starter",
      "region": "oregon",
      "repo": "https://github.com/cardarellocristian86-debug/skinharmony-ai-backend",
      "branch": "agent/mcp-staging-shared-memory-release",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --prefix services/mcp-staging-db-bootstrap && npm ci --prefix services/skinharmony-core-mcp",
      "startCommand": "npm --prefix services/mcp-staging-db-bootstrap start",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "10001" },
        { "key": "MCP_STAGING_BOOTSTRAP_ENVIRONMENT", "value": "staging" },
        { "key": "MCP_STAGING_CONTROL_PLANE_PROFILE", "value": "collaboration" },
        { "key": "MCP_STAGING_DB_BOOTSTRAP_MODE", "value": "hold" }
      ]
    },
    {
      "type": "pserv",
      "name": "skinharmony-core-staging-issuer",
      "runtime": "node",
      "plan": "starter",
      "region": "oregon",
      "repo": "https://github.com/cardarellocristian86-debug/skinharmony-ai-backend",
      "branch": "agent/mcp-staging-shared-memory-release",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --prefix services/mcp-staging-issuer",
      "startCommand": "npm --prefix services/mcp-staging-issuer start",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "8789" },
        { "key": "MCP_STAGING_ENVIRONMENT", "value": "staging" },
        { "key": "MCP_STAGING_ISSUER_MODE", "value": "core" },
        { "key": "MCP_STAGING_ISSUER_PROTOCOL", "value": "collaboration" },
        { "key": "MCP_STAGING_ISSUER_STARTUP_MODE", "value": "jwks_only" },
        {
          "key": "MCP_STAGING_COLLABORATION_AUDIENCE",
          "value": "https://skinharmony-core-mcp-staging.onrender.com/mcp"
        },
        { "key": "MCP_STAGING_ISSUER_SIGNING_SECRET", "generateValue": true },
        { "key": "MCP_STAGING_ISSUER_AUTH_TOKEN", "generateValue": true }
      ]
    },
    {
      "type": "pserv",
      "name": "skinharmony-nyra-staging-issuer",
      "runtime": "node",
      "plan": "starter",
      "region": "oregon",
      "repo": "https://github.com/cardarellocristian86-debug/skinharmony-ai-backend",
      "branch": "agent/mcp-staging-shared-memory-release",
      "autoDeployTrigger": "off",
      "buildCommand": "npm ci --prefix services/mcp-staging-issuer",
      "startCommand": "npm --prefix services/mcp-staging-issuer start",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "8789" },
        { "key": "MCP_STAGING_ENVIRONMENT", "value": "staging" },
        { "key": "MCP_STAGING_ISSUER_MODE", "value": "nyra" },
        { "key": "MCP_STAGING_ISSUER_PROTOCOL", "value": "collaboration" },
        { "key": "MCP_STAGING_ISSUER_STARTUP_MODE", "value": "jwks_only" },
        {
          "key": "MCP_STAGING_COLLABORATION_AUDIENCE",
          "value": "https://skinharmony-core-mcp-staging.onrender.com/mcp"
        },
        { "key": "MCP_STAGING_ISSUER_SIGNING_SECRET", "generateValue": true },
        { "key": "MCP_STAGING_ISSUER_AUTH_TOKEN", "generateValue": true }
      ]
    }
          ]
        }
      ]
    }
  ]
}
