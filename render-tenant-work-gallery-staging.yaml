# Isolated canary stack for Tenant Work Gallery.
#
# This Blueprint intentionally does not reference a production database, disk,
# Core service, Nyra service, or provider credential. The only shared values
# are the MCP-to-Core staging bridge secrets, generated by the staging MCP and
# consumed by the staging Core through Render's private secret reference.

databases:
  - name: skinharmony-mcp-twg-staging-db
    # Omitted deliberately: Render retains the existing 0.1c-256mb plan.
    # Declaring `free` here attempts a prohibited downgrade during validation.
    region: oregon
    connectionPool: none
    storageAutoscalingEnabled: false
    # Render services in the private network remain able to connect. Public
    # database connections are deliberately disabled for this test database.
    ipAllowList: []

services:
  - type: web
    name: skinharmony-universal-core-twg-staging
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    # The old feature branches drifted from production and kept rebuilding.
    # The canary now follows reviewed main releases, manually only.
    branch: main
    autoDeployTrigger: off
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run core:service
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - scripts/build-rust-extractor-render.sh
        - services/universal-core-service/**
        - services/shared/**
        - universal-core/**
        - skinharmony-rust-extractor-governor/**
        - render-tenant-work-gallery-staging.yaml
      ignoredPaths:
        - services/universal-core-service/test/**
        - universal-core/tests/**
        - docs/**
        - reports/**
        - shared-work-memory/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKINHARMONY_BUILD_RUST_COMPONENTS
        value: all
      - key: CORE_SERVICE_NAME
        value: universal-core-service-staging
      - key: CORE_SERVICE_STORAGE_ROOT
        value: /var/data/universal-core-service
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_LOCK_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_MIGRATION_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_MIGRATION_LOCK_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TRANSACTION_TIMEOUT_MS
        value: "15000"
      - key: CORE_SERVICE_ADMIN_KEY
        generateValue: true
      - key: CORE_EVIDENCE_SIGNING_SECRET
        generateValue: true
      - key: GOVERNED_AGENT_DATABASE_URL
        fromDatabase:
          name: skinharmony-mcp-twg-staging-db
          property: connectionString
      - key: CORE_MCP_TENANT_GATEWAY_KEY
        fromService:
          type: web
          name: skinharmony-core-mcp-twg-staging
          envVarKey: CORE_MCP_TENANT_GATEWAY_KEY
      - key: CORE_OWNER_CONTEXT_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp-twg-staging
          envVarKey: CORE_OWNER_CONTEXT_SIGNING_SECRET
      - key: DTT_AGENT_IDENTITY_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp-twg-staging
          envVarKey: DTT_AGENT_IDENTITY_SIGNING_SECRET
      - key: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp-twg-staging
          envVarKey: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
      - key: CORE_RUNTIME_V2_MODE
        value: active
      - key: CORE_DTT_ENABLED
        value: "true"
      - key: CORE_DTT_MODE
        value: active
      - key: CORE_DTT_TENANT_ALLOWLIST
        value: codexai
      - key: CORE_RESEARCH_DISTILLATION_ENABLED
        value: "false"
      - key: CORE_NYRA_DEEP_BRANCH_V2_ENABLED
        value: "false"
      - key: CORE_NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_ENABLED
        value: "false"
      - key: NYRA_DEEP_RUNTIME_ENABLED
        value: "false"
    disk:
      name: universal-core-twg-staging-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: skinharmony-core-mcp-twg-staging
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run core:mcp
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - scripts/build-rust-extractor-render.sh
        - services/skinharmony-core-mcp/**
        - services/shared/**
        - render-tenant-work-gallery-staging.yaml
      ignoredPaths:
        - services/skinharmony-core-mcp/test/**
        - docs/**
        - reports/**
        - shared-work-memory/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKINHARMONY_BUILD_RUST_COMPONENTS
        value: none
      - key: NYRA_FAST_READ_PATH_ENABLED
        value: "true"
      - key: UNIVERSAL_CORE_REQUEST_TIMEOUT_MS
        value: "8000"
      - key: UNIVERSAL_CORE_LONG_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: UNIVERSAL_CORE_RESPONSE_LIMIT_BYTES
        value: "524288"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_LOCK_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_MIGRATION_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_MIGRATION_LOCK_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TRANSACTION_TIMEOUT_MS
        value: "15000"
      - key: MCP_PUBLIC_URL
        value: https://skinharmony-core-mcp-twg-staging.onrender.com
      # Kept external to the Blueprint: this canary must never inherit a
      # production Auth0 secret. Populate these only with the isolated staging
      # application values before exercising a client OAuth login.
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_OWNER_TENANT_BINDINGS_JSON
        sync: false
      - key: AUTH0_TENANT_MEMBERSHIPS_JSON
        sync: false
      - key: AUTH0_OWNER_CONFIRMATION_MAX_AGE_SECONDS
        # Keep the canary aligned with production: owner confirmation remains
        # a short bootstrap for bounded Core delegations. Long-running gallery
        # work uses expiring operation-bound leases/delegations instead.
        value: "300"
      - key: MCP_TENANT_CLAIM
        value: https://skinharmony.it/tenant_id
      - key: CODEX_BEARER_KEYS
        generateValue: true
      - key: CODEX_BEARER_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      - key: MCP_DEFAULT_TENANT_ID
        value: codexai
      - key: MCP_CHATGPT_TENANT_ID
        value: codexai
      - key: MCP_SELF_SERVICE_TENANTS_ENABLED
        value: "true"
      - key: MCP_TENANT_OWNER_ROLE_CLAIM
        value: https://skinharmony.it/role
      - key: MCP_TENANT_OWNER_ROLES
        value: tenant_owner,tenant_admin,owner_root
      - key: MCP_SUPPORTED_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      - key: NYRA_GOD_MODE_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_TENANT_IDS
        value: codexai
      - key: NYRA_GOD_MODE_CODEX_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_EMERGENCY_STOP
        value: "false"
      - key: UNIVERSAL_CORE_URL
        value: https://skinharmony-universal-core-twg-staging.onrender.com
      - key: CORE_MCP_TENANT_GATEWAY_KEY
        generateValue: true
      - key: CORE_OWNER_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: DTT_AGENT_IDENTITY_SIGNING_SECRET
        generateValue: true
      - key: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
        generateValue: true
      - key: SHARED_WORK_MEMORY_ROOT
        value: ./shared-work-memory-staging
      - key: DATABASE_URL
        fromDatabase:
          name: skinharmony-mcp-twg-staging-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: MCP_COLLABORATION_DATABASE_URL
        fromDatabase:
          name: skinharmony-mcp-twg-staging-db
          property: connectionString
      - key: MCP_COLLABORATION_DATABASE_SSL
        value: "true"
      - key: CORE_DECISION_LEDGER_REQUIRED
        value: "true"
      - key: CLOUD_MEMORY_MAX_DOCUMENT_BYTES
        value: "250000"
      - key: NYRA_OPENAI_RESEARCH_ENABLED
        value: "false"
