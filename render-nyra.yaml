services:
  - type: web
    name: skinharmony-nyra-core
    env: node
    plan: starter
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: main
    # Federation anti-replay is process-local. Keep one instance until the
    # persistent nonce ledger is the only configured implementation.
    numInstances: 1
    buildCommand: npm ci && npm run nyra:deep-v2:runtime:verify
    startCommand: npm run nyra:render
    # Render uses process liveness for rollout. /healthz remains the strict
    # Nyra/Core dependency contract checked after deployment.
    healthCheckPath: /livez
    # Automatic deploys stay paused during stabilization. A reviewed manual
    # release still requires repository CI, Core and host authorization.
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - scripts/build-rust-extractor-render.sh
        - scripts/build-nyra-deep-branch-v2-runtime-artifacts.mjs
        - scripts/lib/**
        - personal-control-center/**
        - universal-core/**
        - services/universal-core-service/src/nyraBranchNetwork.js
        - mail/load_env.js
        - google_api.js
        - render-nyra.yaml
      ignoredPaths:
        - personal-control-center/test/**
        - universal-core/tests/**
        - docs/**
        - reports/**
        - shared-work-memory/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKINHARMONY_BUILD_RUST_COMPONENTS
        value: none
      - key: NYRA_SERVICE_NAME
        value: nyra-horizontal-runtime
      - key: NYRA_DOMAIN_PACK_ID
        value: skinharmony
      - key: NYRA_STORAGE_ROOT
        value: /var/data
      - key: NYRA_FINANCE_SHARED_CAPITAL_EUR
        value: "1000000"
      - key: NYRA_WORLD_MARKET_CACHE_TTL_MS
        value: "900000"
      - key: NYRA_ASSET_HISTORY_CACHE_TTL_MS
        value: "86400000"
      - key: NYRA_WORLD_PAPER_AUTOSTART
        value: "true"
      - key: NYRA_WORLD_PAPER_RUN_ON_BOOT
        value: "false"
      - key: NYRA_WORLD_PAPER_INTERVAL_MINUTES
        value: "60"
      - key: NYRA_ENABLE_BASIC_AUTH
        value: "true"
      - key: NYRA_DISABLE_BASIC_AUTH
        value: "false"
      - key: NYRA_BASIC_USER
        sync: false
      - key: NYRA_BASIC_PASSWORD
        sync: false
      - key: NYRA_API_KEYS
        sync: false
      - key: NYRA_ANALYZER_API_KEYS
        sync: false
      - key: NYRA_RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: NYRA_BODY_LIMIT
        value: "1mb"
      - key: NYRA_CORE_URL
        value: "https://skinharmony-universal-core.onrender.com"
      - key: NYRA_CORE_KEY
        sync: false
      - key: NYRA_CORE_TENANT_ID
        value: "codexai"
      - key: NYRA_DEEP_BRANCH_V2_ENABLED
        value: "true"
      - key: NYRA_DEEP_BRANCH_V2_RUNTIME_MODE
        value: lazy
      - key: NYRA_DEEP_BRANCH_V2_MODE
        value: shadow
      # The runtime artifact contains 24 branches. These 22 are the existing
      # production authority surface; new branches require a separate review.
      - key: NYRA_DEEP_BRANCH_V2_BRANCHES
        value: context_intelligence,work_intake,research_evidence,decision_reasoning,planning_prioritization,risk_governance,delegated_authority,decision_provenance,relational_supervision,agent_orchestration,ai_orchestration,execution_planning,parallel_coordination,tenant_work_coordination,quality_verification,learning_memory,adaptive_learning,communication_explanation,software_intelligence,suite_domain,smartdesk_domain,analyzer_domain
      - key: NYRA_DEEP_BRANCH_V2_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_BRANCH_V2_FEDERATION_ENABLED
        value: "true"
      - key: NYRA_DEEP_BRANCH_V2_FEDERATION_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_BRANCH_V2_CORE_SHARED_SECRET
        generateValue: true
      - key: NYRA_DEEP_BRANCH_V2_ENVELOPE_MAX_AGE_MS
        value: "60000"
      - key: NYRA_DEEP_BRANCH_V2_REPLAY_STORE_PATH
        value: /var/data/runtime/nyra-learning/nyra_deep_v2_replay_store.json
      # Operational evaluation remains advisory and requires an exact,
      # tenant-scoped Ed25519 attestation issued by Universal Core.
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_ENABLED
        value: "true"
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_BRANCH_V2_CORE_ATTESTATION_KEY_ID_ALLOWLIST
        value: universal-core-nyra-v2
      - key: NYRA_DEEP_BRANCH_V2_CORE_ATTESTATION_PUBLIC_KEYS
        sync: false
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_ATTESTATION_MAX_AGE_MS
        value: "60000"
      # Policy Registry proof remains code-dark until both services have pinned
      # public material, an external signer and a distributed replay backend.
      - key: NYRA_POLICY_REGISTRY_ATTESTATION_ENABLED
        value: "false"
      - key: NYRA_POLICY_REGISTRY_ATTESTATION_REQUIRED
        value: "false"
      - key: NYRA_POLICY_REGISTRY_SIGNER_MODE
        value: disabled
      - key: NYRA_POLICY_REGISTRY_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_POLICY_REGISTRY_CORE_SERVICE_KEY
        generateValue: true
      - key: NYRA_POLICY_REGISTRY_CORE_KEY_ID
        value: universal-core-policy-registry-v1
      - key: NYRA_POLICY_REGISTRY_NYRA_KEY_ID
        value: nyra-policy-registry-v1
      - key: NYRA_POLICY_REGISTRY_CORE_PUBLIC_KEY
        sync: false
      - key: NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY
        sync: false
      - key: NYRA_POLICY_REGISTRY_CORE_PUBLIC_KEY_FINGERPRINT
        sync: false
      - key: NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY_FINGERPRINT
        sync: false
      - key: NYRA_POLICY_REGISTRY_ATTESTATION_MAX_AGE_MS
        value: "300000"
      # A dedicated least-privilege PostgreSQL DSN is provisioned manually;
      # the MCP/Core database credential is deliberately not copied here.
      - key: NYRA_POLICY_REGISTRY_DATABASE_URL
        sync: false
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_ORIGIN
        sync: false
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_PATH
        value: /v1/policy-registry/nyra/sign
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_SERVICE
        value: nyra-policy-registry-signer
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_TARGET_COMMIT
        sync: false
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_PURPOSE
        value: nyra.policy_registry.attestation
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_KEY_ID
        value: nyra-policy-registry-v1
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_SERVICE_TOKEN
        sync: false
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_TIMEOUT_MS
        value: "1500"
      - key: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_MAX_RESPONSE_BYTES
        value: "4096"
      - key: NYRA_RESEARCH_MCP_URL
        value: "https://skinharmony-core-mcp.onrender.com"
      - key: NYRA_SUITE_CORE_URL
        value: "https://skinharmony-universal-core.onrender.com"
      - key: NYRA_SUITE_CORE_KEY
        sync: false
      - key: NYRA_SUITE_CORE_TENANT_ID
        value: "skinharmony-suite"
      - key: NYRA_SUITE_BRIDGE_KEY
        sync: false
      - key: SMARTDESK_URL
        value: "https://skinharmony-smartdesk-live.onrender.com"
      - key: SMARTDESK_BRIDGE_API_KEY
        sync: false
      - key: WP_URL
        value: "https://www.skinharmony.it"
      - key: WP_USER
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
    disk:
      name: nyra-core-data
      mountPath: /var/data
      sizeGB: 10
