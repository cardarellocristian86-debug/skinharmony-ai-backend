services:
  - type: web
    name: skinharmony-core-mcp
    branch: main
    env: node
    plan: starter
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: main
    buildCommand: npm ci
    startCommand: npm run core:mcp
    # Render needs process liveness during rollout. Governed dependency
    # readiness remains available at /healthz and /readyz.
    healthCheckPath: /livez
    # Automatic deploys stay paused during stabilization. A reviewed manual
    # release still requires repository CI, Core and host authorization.
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - scripts/build-rust-extractor-render.sh
        - services/skinharmony-core-mcp/**
        - services/universal-core-service/src/softwareCognition.js
        - services/shared/**
        - render-core-mcp.yaml
      ignoredPaths:
        - services/skinharmony-core-mcp/test/**
        - docs/**
        - reports/**
        - shared-work-memory/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKINHARMONY_BUILD_RUST_COMPONENTS
        value: none
      - key: NYRA_FAST_READ_PATH_ENABLED
        value: "true"
      - key: UNIVERSAL_CORE_REQUEST_TIMEOUT_MS
        value: "8000"
      - key: UNIVERSAL_CORE_LONG_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: UNIVERSAL_CORE_RESPONSE_LIMIT_BYTES
        value: "524288"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_LOCK_TIMEOUT_MS
        value: "2000"
      - key: DATABASE_MIGRATION_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_MIGRATION_LOCK_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TRANSACTION_TIMEOUT_MS
        value: "15000"
      - key: MCP_PUBLIC_URL
        value: https://skinharmony-core-mcp.onrender.com
      - key: MCP_ENVIRONMENT_ROUTING_REQUIRED
        value: "true"
      - key: MCP_STAGING_MCP_URL
        value: https://skinharmony-core-mcp-staging.onrender.com
      - key: MCP_ENVIRONMENT_DELEGATION_KEY
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        value: https://skinharmony-core-mcp.onrender.com/mcp
      - key: AUTH0_OWNER_TENANT_BINDINGS_JSON
        sync: false
      # Server-side subject memberships for shared tenant collaboration.
      # Values must be {"tenant_id":"...","role":"member|reviewer|operator"}.
      # This map never grants owner or provider-setup capabilities.
      - key: AUTH0_TENANT_MEMBERSHIPS_JSON
        sync: false
      - key: AUTH0_OWNER_CONFIRMATION_MAX_AGE_SECONDS
        # Short, fresh owner confirmation is only the bootstrap for issuing
        # bounded Core delegations. Long-running work must use expiring,
        # operation-bound delegation/ticket leases instead of treating an old
        # OAuth token as fresh owner authority.
        value: "300"
      - key: MCP_TENANT_CLAIM
        value: https://skinharmony.it/tenant_id
      - key: MCP_DEFAULT_TENANT_ID
        value: codexai
      - key: MCP_CHATGPT_TENANT_ID
        value: codexai
      - key: MCP_SUPPORTED_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      # This is a manually provisioned service bearer for the native Codex /
      # ChatGPT host connection. It is not an OpenAI API key and is never
      # returned by MCP tools, Core, Nyra or the continuity memory.
      - key: CODEX_BEARER_KEYS
        sync: false
      - key: CODEX_BEARER_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      # Compatibility is explicit during the registry migration so this code
      # deploy does not revoke active Codex work. After the Codex bearer is
      # moved to the exact host-app registry entry, set this false and remove
      # the old CODEX_BEARER_KEYS value.
      - key: MCP_LEGACY_CODEX_HOST_PRINCIPAL_ENABLED
        value: "true"
      # Strict server-owned app registry. Provision it atomically with its
      # referenced bearer variables; never place bearer values inside JSON.
      - key: MCP_HOST_APP_REGISTRY_JSON
        sync: false
      - key: MCP_HOST_APP_TOKEN_CODEX
        sync: false
      - key: NYRA_GOD_MODE_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_TENANT_IDS
        value: owner-private,codexai
      - key: NYRA_GOD_MODE_CODEX_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_EMERGENCY_STOP
        value: "false"
      - key: UNIVERSAL_CORE_URL
        value: https://skinharmony-universal-core.onrender.com
      - key: GITHUB_STANDING_RELEASE_WORKER_URL
        value: https://skinharmony-github-standing-release.onrender.com
      # The worker call is one-shot. A timeout or oversized response leaves
      # the Core ticket reconciliation-required and never triggers a retry.
      - key: GITHUB_STANDING_RELEASE_WORKER_REQUEST_TIMEOUT_MS
        value: "20000"
      - key: GITHUB_STANDING_RELEASE_WORKER_RESPONSE_LIMIT_BYTES
        value: "262144"
      # A reserved Core ticket carrying a signed GitHub execution claim is
      # forwarded once to the worker. Only a bound succeeded result is written
      # back to Core; uncertain outcomes stop for explicit reconciliation.
      - key: STANDING_RELEASE_AUTO_COORDINATOR_ENABLED
        value: "true"
      - key: UNIVERSAL_CORE_KEYS_JSON
        sync: false
      - key: UNIVERSAL_CORE_KEY
        sync: false
      # The web compatibility tools are not published when this exact-origin
      # allowlist is empty. Keep dashboard configuration explicit and secret-
      # independent; comma-separated HTTPS origins only.
      - key: WEB_AGENT_ALLOWED_ORIGINS
        sync: false
      # Presence signatures and fingerprints must never reuse a Core bearer or
      # another host-native secret.
      - key: AGENT_SIGNATURE_SECRET
        generateValue: true
      # Presence v2 is live-verified before governed continuation is promoted.
      # Configuration remains fail-closed without the independent signer,
      # registered host applications, v2 presence, and host-native protocol.
      - key: AGENT_PRESENCE_SIGNATURE_VERSION
        value: "v2"
      - key: NYRA_GOVERNED_CONTINUE_ENABLED
        value: "true"
      - key: NYRA_GOVERNED_CONTINUE_SIGNING_SECRET
        generateValue: true
      - key: CORE_MCP_TENANT_GATEWAY_KEY
        generateValue: true
      # Dedicated MCP→Core tenant-context signature. Keep it distinct from
      # the gateway bearer, owner confirmation and agent identity secrets.
      - key: CORE_MCP_TENANT_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: MCP_SELF_SERVICE_TENANTS_ENABLED
        value: "true"
      - key: MCP_TENANT_OWNER_ROLE_CLAIM
        value: https://skinharmony.it/role
      - key: MCP_TENANT_OWNER_ROLES
        value: tenant_owner,tenant_admin,owner_root
      # Render generates this once; Universal Core consumes it through an
      # internal fromService reference. It is not an OpenAI key.
      - key: CORE_OWNER_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: DTT_AGENT_IDENTITY_SIGNING_SECRET
        generateValue: true
      # Generic Work Core Join is fail-closed on the pinned public verifier,
      # durable shared store and Universal Core remote signer. This service
      # holds verifier material only; never add a private key here.
      - key: GENERIC_WORK_CORE_JOIN_ENABLED
        value: "true"
      - key: GENERIC_WORK_CORE_JOIN_REQUIRED
        value: "true"
      - key: GENERIC_WORK_CORE_JOIN_ED25519_KEY_ID
        value: universal-core-generic-join-v1
      - key: GENERIC_WORK_CORE_JOIN_ED25519_PUBLIC_KEY
        sync: false
      # Policy Registry mutations remain code-dark until Universal Core reports
      # the exact enforced, distributed and cryptographically verified E2E
      # health contract. MCP holds no Policy Registry signer, proof or Nyra S2S
      # secret; it forwards only authenticated Work and owner contexts.
      - key: NYRA_POLICY_REGISTRY_LIFECYCLE_ENABLED
        value: "false"
      - key: NYRA_POLICY_REGISTRY_LIFECYCLE_REQUIRED
        value: "false"
      # Core MCP is the existing isolated signer custody boundary. Target
      # commits are operator-rotated atomically with Universal Core; signing
      # material remains provisioned only in Render and is never generated or
      # replaced by a source deployment.
      - key: POLICY_REGISTRY_CORE_SIGNER_ENABLED
        value: "true"
      - key: POLICY_REGISTRY_CORE_SIGNER_SERVICE
        value: universal-core-policy-registry-signer
      - key: POLICY_REGISTRY_CORE_SIGNER_KEY_ID
        value: universal-core-policy-registry-v1
      - key: POLICY_REGISTRY_CORE_SIGNER_TARGET_COMMIT
        sync: false
      - key: POLICY_REGISTRY_CORE_SIGNER_SERVICE_TOKEN
        sync: false
      - key: POLICY_REGISTRY_CORE_SIGNER_SEED
        sync: false
      - key: POLICY_REGISTRY_NYRA_SIGNER_ENABLED
        value: "true"
      - key: POLICY_REGISTRY_NYRA_SIGNER_SERVICE
        value: nyra-policy-registry-signer
      - key: POLICY_REGISTRY_NYRA_SIGNER_KEY_ID
        value: nyra-policy-registry-v1
      - key: POLICY_REGISTRY_NYRA_SIGNER_TARGET_COMMIT
        sync: false
      - key: POLICY_REGISTRY_NYRA_SIGNER_SERVICE_TOKEN
        sync: false
      - key: POLICY_REGISTRY_NYRA_SIGNER_SEED
        sync: false
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_ENABLED
        value: "true"
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_SERVICE
        value: universal-core-service
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_PURPOSE
        value: generic_work_core_join_v1
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_KEY_ID
        value: universal-core-generic-join-v1
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_SERVICE_TOKEN
        sync: false
      - key: GENERIC_WORK_CORE_JOIN_CORE_SIGNER_SEED
        sync: false
      # Dedicated MCP→Core Deep V2 request signature. Universal Core consumes
      # the same generated value through an internal Render reference. It is
      # an internal continuity signature, not a model-provider credential.
      - key: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
        generateValue: true
      - key: SUITE_CONTROL_PLANE_URL
        value: https://skinharmony-suite-control.onrender.com
      - key: SUITE_CONTROL_PLANE_KEYS_JSON
        sync: false
      - key: SUITE_CONTROL_PLANE_TIMEOUT_MS
        value: "8000"
      - key: SUITE_CONTROL_PLANE_CACHE_TTL_MS
        value: "5000"
      - key: SHARED_WORK_MEMORY_ROOT
        value: ./shared-work-memory
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CLOUD_MEMORY_MAX_DOCUMENT_BYTES
        value: "250000"
      - key: AGENT_WORKSPACE_ROOT
        sync: false
      - key: MEMORY_FABRIC_ROOT
        sync: false
      - key: MEMORY_RETENTION_DAYS
        value: "365"
      - key: MEMORY_PERSONAL_RETENTION_DAYS
        value: "90"
      - key: RESEARCH_CORTEX_ROOT
        sync: false
      - key: RESEARCH_RETENTION_DAYS
        value: "365"
      # The code defaults both continuity features to false. The production
      # Blueprint opts in explicitly; neither flag enables a model provider.
      - key: WORK_CONTINUITY_AUTO_CAPTURE_ENABLED
        value: "true"
      - key: HOST_NATIVE_AGENT_PROTOCOL_ENABLED
        value: "true"
      # Canonical, non-secret project release scope. Nyra uses this binding to
      # translate an Autopilot proposal into the one native Core plan that
      # release closure validates; a new chat never has to rediscover it.
      - key: NYRA_PROJECT_RELEASE_BINDINGS_JSON
        value: '{"schema_version":"nyra_project_release_bindings_v1","bindings":[{"tenant_id":"codexai","project_id":"skinharmony-ai-backend","repository":"cardarellocristian86-debug/skinharmony-ai-backend","base_branch":"main","required_checks":["core-mcp","deployment-parity","universal-core"]}]}'
      # The Software/Architecture Atlas accepts a repository only from this
      # server-owned project binding. It is deliberately public metadata, not
      # a GitHub credential; private repositories require a separate tenant
      # credential mapping provisioned only in Render.
      - key: NYRA_ATLAS_REPOSITORY_BINDINGS_JSON
        value: '{"skinharmony-ai-backend":{"repository":"cardarellocristian86-debug/skinharmony-ai-backend","branch":"main"},"nyra_conversational_runtime":{"repository":"cardarellocristian86-debug/skinharmony-ai-backend","branch":"main"}}'
      # Every functional Nyra/Core call creates or refreshes a server-derived
      # signed tenant presence. This is identity registration only: it grants
      # no role, model, tool, credential, merge, deploy or external authority.
      - key: MANDATORY_AGENT_PRESENCE_ENABLED
        value: "true"
