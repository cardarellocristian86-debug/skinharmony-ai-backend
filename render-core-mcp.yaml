services:
  - type: web
    name: skinharmony-core-mcp
    env: node
    plan: starter
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: main
    buildCommand: npm ci
    startCommand: npm run core:mcp
    healthCheckPath: /healthz
    # A merge/push to the linked main branch deploys only after repository CI
    # checks pass. This trigger does not replace Core or host authorization.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_PUBLIC_URL
        value: https://skinharmony-core-mcp.onrender.com
      - key: MCP_ENVIRONMENT_ROUTING_REQUIRED
        value: "true"
      - key: MCP_STAGING_MCP_URL
        value: https://skinharmony-core-mcp-staging.onrender.com
      - key: MCP_ENVIRONMENT_DELEGATION_KEY
        sync: false
      - key: AUTH0_ISSUER
        sync: false
      - key: AUTH0_AUDIENCE
        value: https://skinharmony-core-mcp.onrender.com/mcp
      - key: AUTH0_OWNER_TENANT_BINDINGS_JSON
        sync: false
      # Server-side subject memberships for shared tenant collaboration.
      # Values must be {"tenant_id":"...","role":"member|reviewer|operator"}.
      # This map never grants owner or provider-setup capabilities.
      - key: AUTH0_TENANT_MEMBERSHIPS_JSON
        sync: false
      - key: AUTH0_OWNER_CONFIRMATION_MAX_AGE_SECONDS
        # Short, fresh owner confirmation is only the bootstrap for issuing
        # bounded Core delegations. Long-running work must use expiring,
        # operation-bound delegation/ticket leases instead of treating an old
        # OAuth token as fresh owner authority.
        value: "300"
      - key: MCP_TENANT_CLAIM
        value: https://skinharmony.it/tenant_id
      - key: MCP_DEFAULT_TENANT_ID
        value: codexai
      - key: MCP_CHATGPT_TENANT_ID
        value: codexai
      - key: MCP_SUPPORTED_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      # This is a manually provisioned service bearer for the native Codex /
      # ChatGPT host connection. It is not an OpenAI API key and is never
      # returned by MCP tools, Core, Nyra or the continuity memory.
      - key: CODEX_BEARER_KEYS
        sync: false
      - key: CODEX_BEARER_SCOPES
        value: core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate
      - key: NYRA_GOD_MODE_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_TENANT_IDS
        value: owner-private,codexai
      - key: NYRA_GOD_MODE_CODEX_ENABLED
        value: "true"
      - key: NYRA_GOD_MODE_EMERGENCY_STOP
        value: "false"
      - key: UNIVERSAL_CORE_URL
        value: https://skinharmony-universal-core.onrender.com
      - key: UNIVERSAL_CORE_KEYS_JSON
        sync: false
      - key: UNIVERSAL_CORE_KEY
        sync: false
      # Presence signatures and fingerprints must never reuse a Core bearer or
      # another host-native secret.
      - key: AGENT_SIGNATURE_SECRET
        generateValue: true
      - key: CORE_MCP_TENANT_GATEWAY_KEY
        generateValue: true
      # Dedicated MCP→Core tenant-context signature. Keep it distinct from
      # the gateway bearer, owner confirmation and agent identity secrets.
      - key: CORE_MCP_TENANT_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: MCP_SELF_SERVICE_TENANTS_ENABLED
        value: "true"
      - key: MCP_TENANT_OWNER_ROLE_CLAIM
        value: https://skinharmony.it/role
      - key: MCP_TENANT_OWNER_ROLES
        value: tenant_owner,tenant_admin,owner_root
      # Render generates this once; Universal Core consumes it through an
      # internal fromService reference. It is not an OpenAI key.
      - key: CORE_OWNER_CONTEXT_SIGNING_SECRET
        generateValue: true
      - key: DTT_AGENT_IDENTITY_SIGNING_SECRET
        generateValue: true
      # Generic Work Core Join remains code-dark until the public verifier pin,
      # durable shared store and Universal Core signer all pass their gates.
      # This service holds verifier material only; never add a private key here.
      - key: GENERIC_WORK_CORE_JOIN_ENABLED
        value: "false"
      - key: GENERIC_WORK_CORE_JOIN_REQUIRED
        value: "false"
      - key: GENERIC_WORK_CORE_JOIN_ED25519_KEY_ID
        value: generic-work-core-join-production-v1
      - key: GENERIC_WORK_CORE_JOIN_ED25519_PUBLIC_KEY
        sync: false
      # Dedicated MCP→Core Deep V2 request signature. Universal Core consumes
      # the same generated value through an internal Render reference. It is
      # an internal continuity signature, not a model-provider credential.
      - key: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
        generateValue: true
      - key: SUITE_CONTROL_PLANE_URL
        value: https://skinharmony-suite-control.onrender.com
      - key: SUITE_CONTROL_PLANE_KEYS_JSON
        sync: false
      - key: SUITE_CONTROL_PLANE_TIMEOUT_MS
        value: "8000"
      - key: SUITE_CONTROL_PLANE_CACHE_TTL_MS
        value: "5000"
      - key: SHARED_WORK_MEMORY_ROOT
        value: ./shared-work-memory
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CLOUD_MEMORY_MAX_DOCUMENT_BYTES
        value: "250000"
      - key: AGENT_WORKSPACE_ROOT
        sync: false
      - key: MEMORY_FABRIC_ROOT
        sync: false
      - key: MEMORY_RETENTION_DAYS
        value: "365"
      - key: MEMORY_PERSONAL_RETENTION_DAYS
        value: "90"
      - key: RESEARCH_CORTEX_ROOT
        sync: false
      - key: RESEARCH_RETENTION_DAYS
        value: "365"
      # The code defaults both continuity features to false. The production
      # Blueprint opts in explicitly; neither flag enables a model provider.
      - key: WORK_CONTINUITY_AUTO_CAPTURE_ENABLED
        value: "true"
      - key: HOST_NATIVE_AGENT_PROTOCOL_ENABLED
        value: "true"
      # Every functional Nyra/Core call creates or refreshes a server-derived
      # signed tenant presence. This is identity registration only: it grants
      # no role, model, tool, credential, merge, deploy or external authority.
      - key: MANDATORY_AGENT_PRESENCE_ENABLED
        value: "true"
