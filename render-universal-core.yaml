services:
  - type: web
    name: skinharmony-universal-core
    env: node
    plan: starter
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: main
    # The bounded provider runner and host-native governance store keep
    # restart-safe state on this service's disk. Pin the service explicitly
    # until both lifecycles use a distributed worker lease.
    numInstances: 1
    buildCommand: npm ci && bash scripts/build-rust-extractor-render.sh
    startCommand: npm run core:service
    # Render needs process liveness during rollout. Governed dependency
    # readiness remains available at /healthz and /readyz.
    healthCheckPath: /livez
    # A merge/push to the linked main branch deploys only after repository CI
    # checks pass. This trigger does not replace Core or host authorization.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORE_SERVICE_NAME
        value: universal-core-service
      - key: CORE_SERVICE_STORAGE_ROOT
        value: /var/data/universal-core-service
      - key: CORE_SERVICE_ADMIN_KEY
        sync: false
      # NSCT stays advisory. Signed Nyra pre-Core decisions remain OFF until
      # the existing Nyra signer purpose and all public pins/S2S bindings are
      # provisioned and verified; this flag never accepts ENFORCED.
      - key: SOFTWARE_COGNITION_MODE
        value: ADVISORY
      # Entity 360 v1 is live only as an immutable context/evidence shadow.
      # It cannot alter production decisions or authorize execution; promotion
      # beyond SHADOW requires a separate Core-governed release.
      - key: CORE_ENTITY360_MODE
        value: SHADOW
      - key: NYRA_PRECORE_DECISION_MODE
        value: "OFF"
      - key: CORE_MCP_TENANT_GATEWAY_KEY
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: CORE_MCP_TENANT_GATEWAY_KEY
      - key: CORE_MCP_TENANT_CONTEXT_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: CORE_MCP_TENANT_CONTEXT_SIGNING_SECRET
      # Reference the MCP-generated signing secret internally. It signs the
      # short-lived, owner-confirmed binding envelope; it is not an OpenAI key.
      - key: CORE_OWNER_CONTEXT_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: CORE_OWNER_CONTEXT_SIGNING_SECRET
      - key: DTT_AGENT_IDENTITY_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: DTT_AGENT_IDENTITY_SIGNING_SECRET
      # Generic Work Core Join is durable in the Blueprint and remains gated by
      # the remote signer/readiness contract; no private key is stored here.
      - key: CORE_GENERIC_WORK_CORE_JOIN_ENABLED
        value: "true"
      - key: CORE_GENERIC_WORK_CORE_JOIN_REQUIRED
        value: "true"
      # A Generic Join signer outage must gate Generic Join only. Release
      # tickets remain available to repair the signer and avoid deadlock.
      - key: CORE_GENERIC_WORK_CORE_JOIN_GATES_GLOBAL_READINESS
        value: "false"
      - key: CORE_GENERIC_WORK_CORE_JOIN_SIGNER_MODE
        value: remote
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_ORIGIN
        sync: false
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_PATH
        value: /v1/generic-work-core-join/sign
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_SERVICE
        value: universal-core-service
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_PURPOSE
        value: generic_work_core_join_v1
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_KEY_ID
        # This is the identity asserted by the remote signing endpoint, not
        # the key id used by Core-MCP's separate (currently code-dark)
        # verifier. Keeping the signer id explicit prevents a Blueprint sync
        # from pinning the correct public JWK to the wrong key id.
        value: universal-core-generic-join-v1
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_SERVICE_TOKEN
        sync: false
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_ED25519_PUBLIC_KEY
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: GENERIC_WORK_CORE_JOIN_ED25519_PUBLIC_KEY
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_TIMEOUT_MS
        value: "1500"
      - key: CORE_GENERIC_WORK_CORE_JOIN_REMOTE_SIGNER_MAX_RESPONSE_BYTES
        value: "4096"
      - key: CORE_GENERIC_WORK_CORE_JOIN_SIGNER_PROBE_TIMEOUT_MS
        value: "2000"
      - key: CORE_GENERIC_WORK_CORE_JOIN_SIGNER_PROBE_COOLDOWN_MS
        value: "5000"
      - key: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: CORE_NYRA_DEEP_BRANCH_V2_MCP_REQUEST_SIGNING_SECRET
      # Use the same managed PostgreSQL connection as the MCP so DTT state,
      # verifier assignments and artifact trust are transactional and shared
      # across restarts. Host-native governance uses its separate atomic file
      # store on the persistent disk and no model-provider key.
      - key: GOVERNED_AGENT_DATABASE_URL
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: DATABASE_URL
      # Owner-managed public pin to a trust key installed offline. This service
      # never receives private material and cannot install or rotate trust keys.
      - key: CORE_BOOTSTRAP_AUTHORITY_TRUST_PIN_JSON
        sync: false
      - key: CORE_EVIDENCE_SIGNING_SECRET
        sync: false
      # Core host-native routes remain fail-closed in code. Production opts in
      # explicitly and uses a dedicated signing secret that is not shared with
      # OAuth, evidence, provider or MCP credentials.
      - key: CORE_HOST_NATIVE_GOVERNANCE_ENABLED
        value: "true"
      - key: CORE_HOST_NATIVE_SIGNING_SECRET
        generateValue: true
      # Owner-custodied JSON object {"<historical-key-id>":"<old-secret>"}.
      # It is verify-only material for Entity 360 historical audit after a
      # host-native key rotation and must never be committed or made public.
      - key: CORE_ENTITY360_HOST_NATIVE_VERIFY_KEYRING_JSON
        sync: false
      # Dedicated Core→GitHub-worker execution-claim domain. The worker may
      # verify only exact short-lived reserved actions; it receives no Core
      # bearer, owner context or DTT signing material.
      - key: CORE_GITHUB_WORKER_EXECUTION_SIGNING_SECRET
        generateValue: true
      # One owner mandate can derive exact, short-lived GitHub/Render actions.
      # The release runner remains host-mediated and fail-closed: this never
      # grants a worker a token, a provider key or autonomous deployment.
      - key: CORE_STANDING_RELEASE_AUTOMATION_ENABLED
        value: "true"
      - key: CORE_STANDING_RELEASE_EMERGENCY_STOP
        value: "false"
      # Exact, non-secret tenant/repository/service bindings used by Core's
      # server-side live readback. Private GitHub repositories additionally
      # require the server-only credential registry documented in the service
      # README; this public repository is intentionally read anonymously.
      - key: CORE_HOST_NATIVE_RENDER_ORIGIN_REGISTRY_JSON
        value: '{"schema_version":"host_native_render_origin_registry_v1","bindings":[{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","service_id":"skinharmony-universal-core","environment":"production","origin":"https://skinharmony-universal-core.onrender.com"},{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","service_id":"skinharmony-core-mcp","environment":"production","origin":"https://skinharmony-core-mcp.onrender.com"},{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","service_id":"skinharmony-nyra-core","environment":"production","origin":"https://skinharmony-nyra-core.onrender.com"},{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","service_id":"srv-d82c9j3tqb8s73cgriag","environment":"production","origin":"https://skinharmony-universal-core.onrender.com"},{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","service_id":"srv-d9vmccfmal7c73fu0srg","environment":"production","origin":"https://skinharmony-github-standing-release.onrender.com"}]}'
      # Server-owned CI policy. The caller may repeat these names only as an
      # equality claim; Core selects the binding and verifies the exact GitHub
      # Actions app, workflow run, event, branch and commit itself.
      - key: CORE_HOST_NATIVE_REQUIRED_CHECKS_REGISTRY_JSON
        value: '{"schema_version":"host_native_required_checks_registry_v1","bindings":[{"tenant_id":"codexai","repository":"cardarellocristian86-debug/skinharmony-ai-backend","base_branch":"main","required_checks":["core-mcp","deployment-parity","universal-core"],"check_app":{"id":15368,"slug":"github-actions","owner":"github"},"workflow":{"id":312527659,"name":"Nyra Core Intelligence","path":".github/workflows/nyra-core-intelligence.yml","sha256":"20ee71e0a4a81b3dd0cfe5a3a1f613eb7f2bd436017d06a30f37d418926ae881","candidate_sha256":"773649a4f22fe7f15ebf9513fb9ab41103541192302419041909bc1edef6d9e4"},"allowed_events":["pull_request","push"]}]}'
      - key: CORE_RUNTIME_V2_MODE
        value: active
      - key: LEXICAL_SEMANTIC_MODE
        value: active
      - key: CORE_DTT_ENABLED
        value: "true"
      - key: CORE_DTT_MODE
        value: active
      - key: CORE_DTT_TENANT_ALLOWLIST
        value: codexai
      - key: CORE_RESEARCH_DISTILLATION_ENABLED
        value: "true"
      - key: CORE_RESEARCH_DISTILLATION_MODE
        value: shadow
      # Research Airlock v1 is a narrow enforcement overlay for
      # research_evidence_intelligence/research_evidence only. It derives a
      # domain-separated key from CORE_EVIDENCE_SIGNING_SECRET and requires
      # PostgreSQL; switching this value to shadow is the fail-closed rollback.
      - key: CORE_RESEARCH_AIRLOCK_MODE
        value: enforced
      - key: CORE_RESEARCH_TENANT_ALLOWLIST
        value: codexai
      - key: CORE_RESEARCH_MAX_DOCUMENTS
        value: "10"
      - key: CORE_RESEARCH_MAX_BYTES
        value: "2000000"
      - key: CORE_RESEARCH_TIMEOUT_MS
        value: "30000"
      - key: CORE_RESEARCH_CACHE_TTL_SECONDS
        value: "3600"
      - key: CORE_DISTILLATION_REQUIRES_REVIEW
        value: "true"
      # Evaluate Policy Registry constraints on every decision. Enforcement
      # becomes mandatory only after a signed, quorum-approved snapshot exists.
      - key: CORE_NYRA_POLICY_REGISTRY_ENFORCEMENT_MODE
        value: advisory_evaluate
      # Policy Registry activation remains code-dark until the external Core
      # signer, Nyra attester and distributed PostgreSQL proof path are pinned
      # and independently verified. Core holds public verification material
      # only; never add an in-process/private signing key here.
      - key: CORE_NYRA_POLICY_REGISTRY_PROOF_ENABLED
        value: "false"
      - key: CORE_NYRA_POLICY_REGISTRY_PROOF_REQUIRED
        value: "false"
      - key: CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_ENABLED
        value: "false"
      - key: CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_REQUIRED
        value: "false"
      - key: CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_MODE
        value: disabled
      - key: CORE_NYRA_POLICY_REGISTRY_COMPILER_TRAVERSAL_BUDGET
        value: "256"
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_MODE
        value: disabled
      - key: CORE_NYRA_POLICY_REGISTRY_TENANT_ALLOWLIST
        value: codexai
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_KEY_ID
        value: universal-core-policy-registry-v1
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_KEY_ID
        value: nyra-policy-registry-v1
      # Verify-only retained Ed25519 public keys for immutable NSCT receipts.
      # Bounded JSON object key_id -> public PEM/JWK; excludes the active key id.
      - key: CORE_NYRA_PRECORE_VERIFY_KEYRING_JSON
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_ORIGIN
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_PATH
        value: /v1/policy-registry/sign
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_SERVICE
        value: universal-core-policy-registry-signer
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_TARGET_COMMIT
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_SERVICE_TOKEN
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_ED25519_PUBLIC_KEY
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_TIMEOUT_MS
        value: "1500"
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_MAX_RESPONSE_BYTES
        value: "4096"
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_PROBE_COOLDOWN_MS
        value: "5000"
      - key: CORE_NYRA_POLICY_REGISTRY_CORE_PUBLIC_KEY_FINGERPRINT
        sync: false
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY_FINGERPRINT
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY_FINGERPRINT
      - key: CORE_NYRA_POLICY_REGISTRY_RECEIPT_SECRET
        generateValue: true
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SERVICE_KEY
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_POLICY_REGISTRY_CORE_SERVICE_KEY
      - key: CORE_NYRA_POLICY_REGISTRY_PROOF_TTL_MS
        value: "300000"
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_ORIGIN
        value: https://skinharmony-nyra-core.onrender.com
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_TIMEOUT_MS
        value: "2500"
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_MAX_RESPONSE_BYTES
        value: "65536"
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_PROBE_COOLDOWN_MS
        value: "5000"
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SERVICE
        value: nyra-horizontal-runtime
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_SERVICE
        value: nyra-policy-registry-signer
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_ORIGIN
        value: https://skinharmony-core-mcp.onrender.com
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_PATH
        value: /v1/policy-registry/nyra/sign
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_TARGET_COMMIT
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_POLICY_REGISTRY_REMOTE_SIGNER_TARGET_COMMIT
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_SERVICE_TOKEN
        fromService:
          type: web
          name: skinharmony-core-mcp
          envVarKey: POLICY_REGISTRY_NYRA_SIGNER_SERVICE_TOKEN
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_ED25519_PUBLIC_KEY
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY
      - key: CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_PURPOSE
        value: nyra.policy_registry.attestation
      - key: CORE_NYRA_DEEP_BRANCH_V2_ENABLED
        value: "true"
      - key: CORE_NYRA_DEEP_BRANCH_V2_MODE
        value: active
      - key: CORE_NYRA_DEEP_BRANCH_V2_URL
        value: https://skinharmony-nyra-core.onrender.com
      - key: CORE_NYRA_DEEP_BRANCH_V2_ALLOWED_ORIGIN
        value: https://skinharmony-nyra-core.onrender.com
      - key: CORE_NYRA_DEEP_BRANCH_V2_SERVICE_KEY
        fromService:
          type: web
          name: skinharmony-nyra-core
          envVarKey: NYRA_DEEP_BRANCH_V2_CORE_SHARED_SECRET
      - key: CORE_NYRA_DEEP_BRANCH_V2_TENANT_ALLOWLIST
        value: codexai
      - key: CORE_NYRA_DEEP_BRANCH_V2_BRANCHES
        value: context_intelligence,work_intake,research_evidence,decision_reasoning,planning_prioritization,risk_governance,delegated_authority,decision_provenance,relational_supervision,agent_orchestration,ai_orchestration,execution_planning,parallel_coordination,tenant_work_coordination,quality_verification,learning_memory,adaptive_learning,communication_explanation,software_intelligence,suite_domain,smartdesk_domain,analyzer_domain
      # Public, non-secret bindings pin Core operational requests to the verified
      # 22-branch / 317-shard runtime artifact. Artifact changes must update
      # these values in the same reviewed release.
      - key: CORE_NYRA_DEEP_BRANCH_V2_EXPECTED_CATALOG_FINGERPRINT
        value: 2dbaad62bd6db41c635bde78069329fa93db0b31d01177b9a1a92976eeb07c93
      - key: CORE_NYRA_DEEP_BRANCH_V2_EXPECTED_ROOT_BINDING_HASH
        value: ed4925ed97b49151b0b6739e894cc40ed759269b8529230777eefc0a134d7e03
      - key: CORE_NYRA_DEEP_BRANCH_V2_TIMEOUT_MS
        value: "2500"
      - key: CORE_NYRA_DEEP_BRANCH_V2_CIRCUIT_FAILURE_THRESHOLD
        value: "3"
      - key: CORE_NYRA_DEEP_BRANCH_V2_CIRCUIT_COOLDOWN_MS
        value: "30000"
      - key: CORE_NYRA_DEEP_BRANCH_V2_LEDGER_SECRET
        generateValue: true
      - key: CORE_NYRA_DEEP_BRANCH_V2_SOURCE_FETCH_TIMEOUT_MS
        value: "5000"
      - key: CORE_NYRA_DEEP_BRANCH_V2_SOURCE_MAX_BYTES
        value: "250000"
      # Private/public Ed25519 material binds every operational advisory to the
      # exact artifact and tenant. Universal Core remains the final authority.
      - key: CORE_NYRA_DEEP_BRANCH_V2_ATTESTATION_PRIVATE_KEY
        sync: false
      - key: CORE_NYRA_DEEP_BRANCH_V2_ATTESTATION_KEY_ID
        value: universal-core-nyra-v2
      - key: CORE_NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_ENABLED
        value: "true"
      - key: CORE_NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_MODE
        value: active
      - key: CORE_NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_RUNTIME_ENABLED
        value: "true"
      - key: NYRA_DEEP_RUNTIME_MODE
        value: active
    disk:
      name: universal-core-service-data
      mountPath: /var/data
      sizeGB: 5
