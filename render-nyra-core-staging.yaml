# Create-only Blueprint for the isolated Nyra Deep V2 staging runtime.
#
# Safety boundary:
# - this file owns exactly one new staging web service;
# - it does not declare, adopt, or mutate Universal Core, Core MCP, a database,
#   an issuer, Auth0, or any production resource;
# - the existing Universal Core staging disk/config overlay is applied only
#   through the request-bound procedure in
#   docs/runbooks/nyra-core-staging-completion.md;
# - secret values are generated by Render and never stored in this repository.

services:
  - type: web
    name: skinharmony-nyra-core-staging
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/cardarellocristian86-debug/skinharmony-ai-backend
    branch: feature/codex-chatgpt-staging-control-v1
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci && npm run nyra:deep-v2:runtime:verify
    startCommand: npm run nyra:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NYRA_SERVICE_NAME
        value: nyra-horizontal-runtime-staging
      - key: NYRA_STORAGE_ROOT
        value: /var/data
      - key: NYRA_RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: NYRA_BODY_LIMIT
        value: 1mb
      - key: NYRA_ENABLE_BASIC_AUTH
        value: "false"
      - key: NYRA_DISABLE_BASIC_AUTH
        value: "true"
      # This protects non-federation API routes. Render generates the value;
      # it is never printed, copied into a client, or committed.
      - key: NYRA_API_KEYS
        generateValue: true
      - key: NYRA_FINANCE_LIVE_AUTOSTART
        value: "false"
      - key: NYRA_WORLD_PAPER_AUTOSTART
        value: "false"
      - key: NYRA_WORLD_PAPER_RUN_ON_BOOT
        value: "false"
      - key: NYRA_DEEP_BRANCH_V2_ENABLED
        value: "true"
      - key: NYRA_DEEP_BRANCH_V2_RUNTIME_MODE
        value: lazy
      # The create-only phase is deliberately shadow. The runbook promotes
      # the exact tested artifact to active without creating another service.
      - key: NYRA_DEEP_BRANCH_V2_MODE
        value: shadow
      - key: NYRA_DEEP_BRANCH_V2_BRANCHES
        value: context_intelligence,work_intake,research_evidence,decision_reasoning,planning_prioritization,risk_governance,delegated_authority,decision_provenance,relational_supervision,agent_orchestration,ai_orchestration,execution_planning,parallel_coordination,quality_verification,learning_memory,adaptive_learning,communication_explanation,software_intelligence,suite_domain,smartdesk_domain,analyzer_domain
      - key: NYRA_DEEP_BRANCH_V2_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_BRANCH_V2_SHARD_CACHE_MAX_ENTRIES
        value: "8"
      - key: NYRA_DEEP_BRANCH_V2_SHARD_CACHE_MAX_BYTES
        value: "16777216"
      - key: NYRA_DEEP_BRANCH_V2_FEDERATION_ENABLED
        value: "true"
      - key: NYRA_DEEP_BRANCH_V2_FEDERATION_TENANT_ALLOWLIST
        value: codexai
      # Universal Core staging consumes this generated value through a
      # provider-native fromService reference. It must never be read back.
      - key: NYRA_DEEP_BRANCH_V2_CORE_SHARED_SECRET
        generateValue: true
      - key: NYRA_DEEP_BRANCH_V2_ENVELOPE_MAX_AGE_MS
        value: "60000"
      - key: NYRA_DEEP_BRANCH_V2_REPLAY_STORE_PATH
        value: /var/data/runtime/nyra-learning/nyra_deep_v2_replay_store.json
      # Operational evaluation remains fail-closed until the remote signer,
      # public verification material, replay persistence, and restart test are
      # all green for this exact commit.
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_ENABLED
        value: "false"
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_EVALUATION_TENANT_ALLOWLIST
        value: codexai
      - key: NYRA_DEEP_BRANCH_V2_CORE_ATTESTATION_KEY_ID_ALLOWLIST
        value: universal-core-nyra-v2
      # Public verification material only. It is populated from the existing
      # staging Core issuer's public JWKS endpoint; no private key is moved.
      - key: NYRA_DEEP_BRANCH_V2_CORE_ATTESTATION_PUBLIC_KEYS
        sync: false
      - key: NYRA_DEEP_BRANCH_V2_OPERATIONAL_ATTESTATION_MAX_AGE_MS
        value: "60000"
    disk:
      name: nyra-core-staging-data
      mountPath: /var/data
      sizeGB: 1
