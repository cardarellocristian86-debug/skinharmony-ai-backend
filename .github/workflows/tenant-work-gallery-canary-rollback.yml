name: Tenant Work Gallery Canary Rollback

on:
  push:
    branches:
      - agent/tenant-work-gallery-20260729

permissions:
  contents: write

concurrency:
  group: tenant-work-gallery-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-or-rollback:
    # A forward-revert creates another push event. Keep it observable, but do
    # not let it become a rollback loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip tenant-work-gallery-rollback]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_HEALTH_URL: https://skinharmony-core-mcp-staging.onrender.com/healthz
      EXPECTED_SHA: ${{ github.sha }}
      ROLLBACK_SHA: ${{ github.event.before }}
      CANARY_REF: agent/tenant-work-gallery-20260729
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Wait for the staged build and PostgreSQL durability checks
        id: staging
        shell: bash
        run: |
          set -euo pipefail

          # Keep the worst case below the job timeout so a failed staging
          # rollout reaches the restoration step instead of being cancelled.
          for attempt in {1..36}; do
            response="$(curl --fail --silent --show-error --max-time 10 "$STAGING_HEALTH_URL" || true)"
            if jq -e --arg expected "$EXPECTED_SHA" '
              .ok == true
              and .build.commit_sha == $expected
              and .cloud_memory.backend == "postgres"
              and .cloud_memory.persistent == true
              and .work_continuity.backend == "postgres"
              and .work_continuity.persistent == true
            ' <<<"$response" >/dev/null; then
              echo "Staging is healthy on $EXPECTED_SHA"
              exit 0
            fi

            echo "Attempt $attempt/36: waiting for Render staging to report $EXPECTED_SHA"
            sleep 15
          done

          echo "Staging did not become healthy on the expected commit" >&2
          exit 1

      - name: Create a forward rollback commit for the prior canary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]

          # A later canary push owns the ref. Never overwrite it with an old
          # automatic rollback decision. The eventual push is fast-forward,
          # so a race after this read is safe as well.
          current_sha="$(git ls-remote origin "refs/heads/$CANARY_REF" | awk '{print $1}')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Canary ref advanced to $current_sha; automatic rollback is intentionally skipped." >&2
            exit 1
          fi

          read -r first_parent second_parent <<<"$(git show -s --format='%P' "$EXPECTED_SHA")"
          if [[ "$first_parent" != "$ROLLBACK_SHA" || -z "$second_parent" ]]; then
            echo "Rollback ancestry is not the published canary merge contract." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert -m 1 --no-edit "$EXPECTED_SHA"
          git commit --amend --message "revert: automatic Tenant Work Gallery canary rollback [skip tenant-work-gallery-rollback]"
          git push origin "HEAD:refs/heads/$CANARY_REF"
