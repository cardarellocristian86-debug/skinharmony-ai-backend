name: Nyra Core Intelligence

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".codex/config.toml"
      - "AGENTS.md"
      - "render-core-mcp.yaml"
      - "render-github-standing-release-worker.yaml"
      - "render-nyra.yaml"
      - "render-universal-core.yaml"
      - "architecture/nyra-deep-branch-v2-*"
      - "personal-control-center/data/nyra-deep-branch-v2.*"
      - "personal-control-center/data/nyra-deep-branch-v2.shards/**"
      - "personal-control-center/lib/nyra-deep-branch-v2*.js"
      - "personal-control-center/lib/nyra-horizontal-runtime.js"
      - "personal-control-center/lib/nyra-policy-registry-attestation.js"
      - "personal-control-center/public/**"
      - "personal-control-center/server.js"
      - "personal-control-center/test/nyra-*"
      - "personal-control-center/README.md"
      - "research/NYRA_DEEP_BRANCH_V2_RESEARCH.md"
      - "scripts/build-rust-extractor-render.sh"
      - "scripts/*nyra-deep-branch-v2.mjs"
      - "scripts/lib/nyra-deep-branch-v2-shards.mjs"
      - "skinharmony-rust-extractor-governor/**"
      - "services/shared/**"
      - "services/github-standing-release-worker/**"
      - "services/skinharmony-core-mcp/**"
      - "services/universal-core-service/**"
      - "smartdesk-live/**"
      - "universal-core/**"
      - "verification/nyra-deep-branch-v2-verification-spec.json"
      - "docs/architecture/governed-continuity-fabric-v1.md"
      - "docs/runbooks/entity-360-rollout-rollback-v1.md"
      - ".github/workflows/nyra-deep-branch-v2.yml"
      - ".github/workflows/nyra-core-intelligence.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".codex/config.toml"
      - "AGENTS.md"
      - "render-core-mcp.yaml"
      - "render-github-standing-release-worker.yaml"
      - "render-nyra.yaml"
      - "render-universal-core.yaml"
      - "architecture/nyra-deep-branch-v2-*"
      - "personal-control-center/data/nyra-deep-branch-v2.*"
      - "personal-control-center/data/nyra-deep-branch-v2.shards/**"
      - "personal-control-center/lib/nyra-deep-branch-v2*.js"
      - "personal-control-center/lib/nyra-horizontal-runtime.js"
      - "personal-control-center/lib/nyra-policy-registry-attestation.js"
      - "personal-control-center/public/**"
      - "personal-control-center/server.js"
      - "personal-control-center/test/nyra-*"
      - "personal-control-center/README.md"
      - "research/NYRA_DEEP_BRANCH_V2_RESEARCH.md"
      - "scripts/build-rust-extractor-render.sh"
      - "scripts/*nyra-deep-branch-v2.mjs"
      - "scripts/lib/nyra-deep-branch-v2-shards.mjs"
      - "skinharmony-rust-extractor-governor/**"
      - "services/shared/**"
      - "services/github-standing-release-worker/**"
      - "services/skinharmony-core-mcp/**"
      - "services/universal-core-service/**"
      - "smartdesk-live/**"
      - "universal-core/**"
      - "verification/nyra-deep-branch-v2-verification-spec.json"
      - "docs/architecture/governed-continuity-fabric-v1.md"
      - "docs/runbooks/entity-360-rollout-rollback-v1.md"
      - ".github/workflows/nyra-deep-branch-v2.yml"
      - ".github/workflows/nyra-core-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/universal-core-service
    steps:
      - uses: actions/checkout@v4
      - name: Validate MCP default tenant blueprint invariant
        shell: ruby {0}
        run: |
          require "yaml"

          path = File.join(ENV.fetch("GITHUB_WORKSPACE"), "render-core-mcp.yaml")
          blueprint = YAML.safe_load(File.read(path))
          services = blueprint.fetch("services")
          abort("services must be an array") unless services.is_a?(Array)

          mcp_services = services.select do |service|
            service.is_a?(Hash) && service["name"] == "skinharmony-core-mcp"
          end
          bindings = services.flat_map do |service|
            next [] unless service.is_a?(Hash)

            Array(service["envVars"])
              .select { |entry| entry.is_a?(Hash) && entry["key"] == "MCP_DEFAULT_TENANT_ID" }
              .map { |entry| [service["name"], entry] }
          end
          expected = [["skinharmony-core-mcp", {
            "key" => "MCP_DEFAULT_TENANT_ID",
            "value" => "codexai"
          }]]
          abort("invalid MCP_DEFAULT_TENANT_ID binding") unless mcp_services.length == 1 && bindings == expected
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/universal-core-service/package-lock.json
      - name: Build governed Rust extractor
        working-directory: .
        run: bash scripts/build-rust-extractor-render.sh
      - name: Test governed Rust extractor workspace
        working-directory: .
        run: |
          export PATH="$HOME/.cargo/bin:$GITHUB_WORKSPACE/.render-rust/cargo/bin:$PATH"
          cargo test --locked --workspace --manifest-path skinharmony-rust-extractor-governor/Cargo.toml
      - name: Test Universal Core native runtime workspace
        working-directory: .
        run: |
          export PATH="$HOME/.cargo/bin:$GITHUB_WORKSPACE/.render-rust/cargo/bin:$PATH"
          cargo test --locked --workspace --manifest-path services/universal-core-service/native/core-runtime/Cargo.toml
      - name: Install Core MCP dependencies for continuity integration tests
        run: npm ci --prefix ../skinharmony-core-mcp
      - run: npm ci
      - name: Test Entity 360 context and evidence layer
        run: >-
          node --test
          test/entity360-adapters.test.js
          test/nyra-precore-decision-store.test.js
          test/entity360-app.test.js
          test/entity360-routes.test.js
          test/entity360-shadow-observation.test.js
          test/entity360.test.js
          test/entity360-store.test.js
          test/icf-event-digest-v2.test.js
          test/core-research-directive-api.test.js
      - name: Benchmark deterministic Entity 360 assembly and verification
        env:
          ENTITY360_BENCHMARK_ITERATIONS: "250"
        run: npm run benchmark:entity360
      - name: Install MCP dependencies for staging integration tests
        working-directory: .
        run: npm ci --prefix services/skinharmony-core-mcp
      - name: Test governed Universal Core automation contracts
        run: |
          node --test \
            test/bootstrap-required-checks-readback.test.js \
            test/host-native-governance.test.js \
            test/host-native-resolver-registry.test.js \
            test/nyra-work-automation-*.test.js
      - name: Test Nyra Work Automation v3 contracts
        working-directory: .
        run: |
          node --test \
            services/universal-core-service/test/nyra-work-automation-api.test.js \
            services/universal-core-service/test/nyra-work-automation-coordinator.test.js \
            services/universal-core-service/test/nyra-work-automation-readback.test.js \
            services/universal-core-service/test/nyra-work-automation-real-components.integration.test.js \
            services/universal-core-service/test/nyra-work-automation-receipt.test.js \
            services/universal-core-service/test/nyra-work-automation-runtime.test.js

  core-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/skinharmony-core-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/skinharmony-core-mcp/package-lock.json
      - name: Install Universal Core dependencies for integration tests
        run: npm ci --prefix ../universal-core-service
      - run: npm ci
      - run: npm test
      - name: Test Nyra Work Automation v3 MCP bridge
        working-directory: .
        run: |
          node --test \
            services/skinharmony-core-mcp/test/nyra-work-automation-attestations.test.js \
            services/skinharmony-core-mcp/test/nyra-work-automation-internal.test.js \
            services/skinharmony-core-mcp/test/nyra-work-automation-tools.test.js

  deployment-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: continuity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d continuity_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/universal-core-service/package-lock.json
      - name: Validate Render continuity feature flags
        shell: ruby {0}
        run: |
          require "digest"
          require "json"
          require "yaml"

          load_blueprint = lambda do |path|
            document = YAML.safe_load(File.read(path))
            services = document.fetch("services")
            abort("#{path}: services must be an array") unless services.is_a?(Array)
            services
          end

          # Exactly one Blueprint may own the production Core service. A
          # second declaration makes Render's last sync win and invalidates
          # host-native provenance/readback guarantees.
          core_blueprint_paths = Dir.glob([
            "render*.yaml", "render*.yml", "**/render*.yaml", "**/render*.yml",
          ]).uniq
          duplicate_core_blueprints = core_blueprint_paths.filter_map do |path|
            next if path == "render-universal-core.yaml"
            document = YAML.safe_load(File.read(path))
            services = document.is_a?(Hash) ? Array(document["services"]) : []
            path if services.any? { |service| service.is_a?(Hash) && service["name"] == "skinharmony-universal-core" }
          end
          abort("duplicate production Universal Core Blueprint: #{duplicate_core_blueprints.join(', ')}") unless
            duplicate_core_blueprints.empty?

          exact_service = lambda do |path, name|
            matches = load_blueprint.call(path)
              .select { |service| service["name"] == name }
            abort("#{path}: expected exactly one #{name} service") unless
              matches.length == 1
            matches.first
          end
          mcp = exact_service.call(
            "render-core-mcp.yaml", "skinharmony-core-mcp"
          )
          core = exact_service.call(
            "render-universal-core.yaml", "skinharmony-universal-core"
          )
          nyra = exact_service.call("render-nyra.yaml", "skinharmony-nyra-core")
          [mcp, core, nyra].each do |service|
            abort("#{service["name"]}: checksPass auto-deploy required") unless service["autoDeployTrigger"] == "checksPass"
            abort("#{service["name"]}: exact GitHub repository required") unless
              service["repo"] == "https://github.com/cardarellocristian86-debug/skinharmony-ai-backend"
            abort("#{service["name"]}: release branch must remain main") unless
              service["branch"] == "main"
          end
          # Render's rollout check must only prove that the process is alive.
          # Core/Nyra dependency readiness stays fail-closed at /readyz and
          # /healthz and is checked by the governed release readback after
          # the service is live. Using dependency readiness here deadlocks a
          # rolling deploy when a peer is briefly restarting.
          abort("#{mcp["name"]}: deployment liveness check must remain /livez") unless
            mcp["healthCheckPath"] == "/livez"
          abort("#{core["name"]}: deployment liveness check must remain /livez") unless
            core["healthCheckPath"] == "/livez"
          abort("#{nyra["name"]}: deployment liveness check must remain /livez") unless
            nyra["healthCheckPath"] == "/livez"

          mcp_env = Array(mcp["envVars"]).to_h { |entry| [entry["key"], entry] }
          %w[
            WORK_CONTINUITY_AUTO_CAPTURE_ENABLED
            HOST_NATIVE_AGENT_PROTOCOL_ENABLED
          ].each do |key|
            abort("#{key} must be explicitly enabled by the MCP Blueprint") unless mcp_env.dig(key, "value") == "true"
          end
          abort("Owner confirmation freshness must remain bounded to delegation bootstrap") unless
            mcp_env.dig("AUTH0_OWNER_CONFIRMATION_MAX_AGE_SECONDS", "value") == "300"
          abort("Native Codex bearer must remain a manually provisioned service secret") unless
            mcp_env["CODEX_BEARER_KEYS"] == {
              "key" => "CODEX_BEARER_KEYS",
              "sync" => false,
            }
          abort("Native Codex bearer must retain the complete governed MCP scope set") unless
            mcp_env.dig("CODEX_BEARER_SCOPES", "value") ==
              "core:read,core:govern,workspace:read,workspace:write,task:read,task:write,agent:coordinate"
          good_mode_contract = {
            "NYRA_GOD_MODE_ENABLED" => "true",
            "NYRA_GOD_MODE_TENANT_IDS" => "owner-private,codexai",
            "NYRA_GOD_MODE_CODEX_ENABLED" => "true",
            "NYRA_GOD_MODE_EMERGENCY_STOP" => "false",
          }
          good_mode_contract.each do |key, expected|
            abort("#{key} must retain the governed Codex Good Mode contract") unless
              mcp_env.dig(key, "value") == expected
          end
          abort("Legacy Codex principal migration must be explicit during first rollout") unless
            mcp_env.dig("MCP_LEGACY_CODEX_HOST_PRINCIPAL_ENABLED", "value") == "true"
          abort("Host-app registry must remain operator-provisioned") unless
            mcp_env["MCP_HOST_APP_REGISTRY_JSON"] == {
              "key" => "MCP_HOST_APP_REGISTRY_JSON", "sync" => false,
            }
          abort("Codex registry bearer must remain operator-provisioned") unless
            mcp_env["MCP_HOST_APP_TOKEN_CODEX"] == {
              "key" => "MCP_HOST_APP_TOKEN_CODEX", "sync" => false,
            }
          agent_presence_version = mcp_env.dig("AGENT_PRESENCE_SIGNATURE_VERSION", "value")
          governed_continue_enabled = mcp_env.dig("NYRA_GOVERNED_CONTINUE_ENABLED", "value")
          safe_governed_continue_rollout_states = [
            ["v1", "false"],
            ["v2", "false"],
            ["v2", "true"],
          ]
          abort("Agent-presence and governed-continuation rollout state is unsafe") unless
            safe_governed_continue_rollout_states.include?([
              agent_presence_version,
              governed_continue_enabled,
            ])
          abort("Governed continuation signer must be independently generated") unless
            mcp_env["NYRA_GOVERNED_CONTINUE_SIGNING_SECRET"] == {
              "key" => "NYRA_GOVERNED_CONTINUE_SIGNING_SECRET", "generateValue" => true,
            }

          core_env = Array(core["envVars"]).to_h { |entry| [entry["key"], entry] }
          nyra_env = Array(nyra["envVars"]).to_h { |entry| [entry["key"], entry] }
          abort("SOFTWARE_COGNITION_MODE must remain ADVISORY") unless
            core_env.dig("SOFTWARE_COGNITION_MODE", "value") == "ADVISORY"
          abort("CORE_ENTITY360_MODE must be declared exactly once as SHADOW") unless
            Array(core["envVars"]).count { |entry| entry["key"] == "CORE_ENTITY360_MODE" } == 1 &&
            core_env["CORE_ENTITY360_MODE"] == {
              "key" => "CORE_ENTITY360_MODE", "value" => "SHADOW",
            }
          abort("NYRA_PRECORE_DECISION_MODE must remain OFF until signer bindings are provisioned") unless
            core_env.dig("NYRA_PRECORE_DECISION_MODE", "value") == "OFF"
          policy_registry_nyra_values = {
            "NYRA_POLICY_REGISTRY_ATTESTATION_ENABLED" => "false",
            "NYRA_POLICY_REGISTRY_ATTESTATION_REQUIRED" => "false",
            "NYRA_POLICY_REGISTRY_SIGNER_MODE" => "disabled",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_PATH" => "/v1/policy-registry/nyra/sign",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_SERVICE" => "nyra-policy-registry-signer",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_PURPOSE" => "nyra.policy_registry.attestation",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_KEY_ID" => "nyra-policy-registry-v1",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_TIMEOUT_MS" => "1500",
            "NYRA_POLICY_REGISTRY_REMOTE_SIGNER_MAX_RESPONSE_BYTES" => "4096",
          }
          policy_registry_nyra_values.each do |key, expected|
            abort("#{key}: Nyra Policy Registry Blueprint contract changed") unless
              Array(nyra["envVars"]).count { |entry| entry["key"] == key } == 1 &&
              nyra_env.dig(key, "value") == expected
          end
          %w[
            NYRA_POLICY_REGISTRY_CORE_PUBLIC_KEY
            NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY
            NYRA_POLICY_REGISTRY_CORE_PUBLIC_KEY_FINGERPRINT
            NYRA_POLICY_REGISTRY_NYRA_PUBLIC_KEY_FINGERPRINT
            NYRA_POLICY_REGISTRY_DATABASE_URL
            NYRA_POLICY_REGISTRY_REMOTE_SIGNER_ORIGIN
            NYRA_POLICY_REGISTRY_REMOTE_SIGNER_TARGET_COMMIT
            NYRA_POLICY_REGISTRY_REMOTE_SIGNER_SERVICE_TOKEN
          ].each do |key|
            abort("#{key}: must remain manually provisioned") unless
              nyra_env[key] == { "key" => key, "sync" => false }
          end
          abort("Nyra Policy Registry S2S secret must remain generated") unless
            nyra_env["NYRA_POLICY_REGISTRY_CORE_SERVICE_KEY"] == {
              "key" => "NYRA_POLICY_REGISTRY_CORE_SERVICE_KEY", "generateValue" => true,
            }
          forbidden_policy_registry_private_keys = [mcp, core, nyra].flat_map do |service|
            Array(service["envVars"]).filter_map do |entry|
              key = String(entry["key"])
              "#{service["name"]}:#{key}" if key.match?(/POLICY_REGISTRY.*PRIVATE_KEY/)
            end
          end
          abort("Policy Registry Blueprints contain private key material: #{forbidden_policy_registry_private_keys.join(', ')}") unless
            forbidden_policy_registry_private_keys.empty?
          forbidden_policy_registry_compiler_peers = [mcp, nyra].flat_map do |service|
            Array(service["envVars"]).filter_map do |entry|
              key = String(entry["key"])
              "#{service["name"]}:#{key}" if key.match?(/POLICY_REGISTRY.*(?:COMPILER|TRUST)/)
            end
          end
          abort("MCP/Nyra Blueprints must not receive Policy Registry compiler or trust inputs: #{forbidden_policy_registry_compiler_peers.join(', ')}") unless
            forbidden_policy_registry_compiler_peers.empty?
          abort("Production Nyra Policy Registry must not fall back to a file replay store") if
            nyra_env.key?("NYRA_POLICY_REGISTRY_REPLAY_STORE_PATH")
          policy_registry_mcp_contract = {
            "NYRA_POLICY_REGISTRY_LIFECYCLE_ENABLED" => {
              "key" => "NYRA_POLICY_REGISTRY_LIFECYCLE_ENABLED", "value" => "false",
            },
            "NYRA_POLICY_REGISTRY_LIFECYCLE_REQUIRED" => {
              "key" => "NYRA_POLICY_REGISTRY_LIFECYCLE_REQUIRED", "value" => "false",
            },
          }
          policy_registry_mcp_contract.each do |key, expected|
            abort("#{key}: Policy Registry MCP Blueprint contract changed") unless
              Array(mcp["envVars"]).count { |entry| entry["key"] == key } == 1 &&
              mcp_env[key] == expected
          end
          policy_registry_mcp_signer_values = {
            "POLICY_REGISTRY_CORE_SIGNER_ENABLED" => "true",
            "POLICY_REGISTRY_CORE_SIGNER_SERVICE" =>
              "universal-core-policy-registry-signer",
            "POLICY_REGISTRY_CORE_SIGNER_KEY_ID" =>
              "universal-core-policy-registry-v1",
            "POLICY_REGISTRY_NYRA_SIGNER_ENABLED" => "true",
            "POLICY_REGISTRY_NYRA_SIGNER_SERVICE" =>
              "nyra-policy-registry-signer",
            "POLICY_REGISTRY_NYRA_SIGNER_KEY_ID" =>
              "nyra-policy-registry-v1",
          }
          policy_registry_mcp_signer_values.each do |key, expected|
            abort("#{key}: Policy Registry MCP signer binding changed") unless
              Array(mcp["envVars"]).count { |entry| entry["key"] == key } == 1 &&
              mcp_env.dig(key, "value") == expected
          end
          %w[
            POLICY_REGISTRY_CORE_SIGNER_TARGET_COMMIT
            POLICY_REGISTRY_CORE_SIGNER_SERVICE_TOKEN
            POLICY_REGISTRY_CORE_SIGNER_SEED
            POLICY_REGISTRY_NYRA_SIGNER_TARGET_COMMIT
            POLICY_REGISTRY_NYRA_SIGNER_SERVICE_TOKEN
            POLICY_REGISTRY_NYRA_SIGNER_SEED
          ].each do |key|
            abort("#{key}: signer custody must remain manually provisioned") unless
              mcp_env[key] == { "key" => key, "sync" => false }
          end
          policy_registry_core_values = {
            "CORE_NYRA_POLICY_REGISTRY_ENFORCEMENT_MODE" => "advisory_evaluate",
            "CORE_NYRA_POLICY_REGISTRY_PROOF_ENABLED" => "false",
            "CORE_NYRA_POLICY_REGISTRY_PROOF_REQUIRED" => "false",
            "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_ENABLED" => "false",
            "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_REQUIRED" => "false",
            "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_MODE" => "disabled",
            "CORE_NYRA_POLICY_REGISTRY_COMPILER_TRAVERSAL_BUDGET" => "256",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_MODE" => "disabled",
            "CORE_NYRA_POLICY_REGISTRY_TENANT_ALLOWLIST" => "codexai",
            "CORE_NYRA_POLICY_REGISTRY_CORE_KEY_ID" => "universal-core-policy-registry-v1",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_KEY_ID" => "nyra-policy-registry-v1",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_PATH" => "/v1/policy-registry/sign",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_SERVICE" =>
              "universal-core-policy-registry-signer",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_TIMEOUT_MS" => "1500",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_MAX_RESPONSE_BYTES" => "4096",
            "CORE_NYRA_POLICY_REGISTRY_CORE_SIGNER_PROBE_COOLDOWN_MS" => "5000",
            "CORE_NYRA_POLICY_REGISTRY_PROOF_TTL_MS" => "300000",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_ORIGIN" =>
              "https://skinharmony-nyra-core.onrender.com",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_TIMEOUT_MS" => "2500",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_MAX_RESPONSE_BYTES" => "65536",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_PROBE_COOLDOWN_MS" => "5000",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_SERVICE" => "nyra-horizontal-runtime",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_SERVICE" =>
              "nyra-policy-registry-signer",
            "CORE_NYRA_POLICY_REGISTRY_NYRA_SIGNER_PURPOSE" =>
              "nyra.policy_registry.attestation",
          }
          policy_registry_core_values.each do |key, expected|
            abort("#{key}: Policy Registry Core Blueprint contract changed") unless
              Array(core["envVars"]).count { |entry| entry["key"] == key } == 1 &&
              core_env.dig(key, "value") == expected
          end
          policy_registry_compiler_code_dark =
            core_env.dig(
              "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_ENABLED", "value"
            ) == "false" &&
            core_env.dig(
              "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_REQUIRED", "value"
            ) == "false" &&
            core_env.dig(
              "CORE_NYRA_POLICY_REGISTRY_COMPILER_PROVENANCE_MODE", "value"
            ) == "disabled"
          if policy_registry_compiler_code_dark
