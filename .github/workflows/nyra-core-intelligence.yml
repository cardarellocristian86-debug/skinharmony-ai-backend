            "DTT_AGENT_IDENTITY_SIGNING_SECRET" => [
              "dttAgentIdentitySigningSecretCandidate",
              "dttAgentIdentitySigningSecret",
            ],
          }
          mcp_secret_contracts.each do |env_key, contract|
            candidate, property = contract
            offset = mcp_config_source.index(env_key)
            abort("#{env_key}: MCP config binding missing") unless offset
            validation_window = mcp_config_source.byteslice(offset, 1_000)
            minimum_pattern =
              /(?:Buffer\.byteLength\(\s*#{Regexp.escape(candidate)}\s*,\s*"utf8"\s*\)|#{Regexp.escape(candidate)}\.length)\s*>=\s*32/
            abort("#{env_key}: MCP minimum 32-byte contract missing") unless
              validation_window.match?(minimum_pattern)
            abort("#{env_key}: MCP normalized property missing") unless
              mcp_config_source.match?(/^\s+#{Regexp.escape(property)},\s*$/)
            abort("#{env_key}: Universal Core verifier binding missing") unless
              core_app_source.include?(env_key)
          end
          core_minimum_contracts = {
            "CORE_MCP_TENANT_CONTEXT_SIGNING_SECRET" =>
              "tenantContextSigningSecretCandidate",
            "CORE_OWNER_CONTEXT_SIGNING_SECRET" =>
              "ownerContextSigningSecretCandidate",
            "DTT_AGENT_IDENTITY_SIGNING_SECRET" =>
              "dttAgentIdentitySecretCandidate",
          }
          core_minimum_contracts.each do |env_key, candidate|
            offset = core_app_source.index(env_key)
            abort("#{env_key}: Universal Core runtime binding missing") unless offset
            validation_window = core_app_source.byteslice(offset, 1_000)
            minimum_pattern =
              /(?:Buffer\.byteLength\(\s*#{Regexp.escape(candidate)}\s*,\s*"utf8"\s*\)|#{Regexp.escape(candidate)}\.length)\s*>=\s*32/
            abort("#{env_key}: Universal Core minimum 32-byte contract missing") unless
              validation_window.match?(minimum_pattern)
          end
          gateway_key_store_offset =
            core_key_store_source.index("function ensureMcpTenantGatewayKey")
          gateway_key_store_window =
            gateway_key_store_offset &&
            core_key_store_source.byteslice(gateway_key_store_offset, 1_200)
          abort("CORE_MCP_TENANT_GATEWAY_KEY: Core minimum 32-byte contract missing") unless
            gateway_key_store_window&.match?(
              /Buffer\.byteLength\(\s*secret\s*,\s*"utf8"\s*\)\s*<\s*32/,
            )
          workflow_rotation_test_source =
            File.read(
              "services/universal-core-service/test/host-native-external-readback.test.js",
            )
          %w[
            stage-A-candidate-policy
            stage-B-live-policy
            post-promote-policy
            candidate-current-rollback
          ].each do |rotation_marker|
            abort("Workflow two-phase rotation regression missing #{rotation_marker}") unless
              workflow_rotation_test_source.include?(rotation_marker)
          end
          %w[
            WORK_CONTINUITY_AUTO_CAPTURE_ENABLED
            HOST_NATIVE_AGENT_PROTOCOL_ENABLED
            MCP_LEGACY_CODEX_HOST_PRINCIPAL_ENABLED
            MCP_HOST_APP_REGISTRY_JSON
            AGENT_PRESENCE_SIGNATURE_VERSION
            NYRA_GOVERNED_CONTINUE_ENABLED
            NYRA_GOVERNED_CONTINUE_SIGNING_SECRET
          ].each do |key|
            abort("#{key} is present in Blueprint but not implemented") unless mcp_config_source.include?(key)
          end
          %w[
            CORE_HOST_NATIVE_GOVERNANCE_ENABLED
            CORE_HOST_NATIVE_SIGNING_SECRET
          ].each do |key|
            abort("#{key} is present in Blueprint but not implemented") unless core_app_source.include?(key)
          end
          abort("Required-checks registry is present in Blueprint but not implemented") unless
            core_resolver_source.include?("CORE_HOST_NATIVE_REQUIRED_CHECKS_REGISTRY_JSON")
          abort("Core host-native route integration missing") unless
            core_app_source.include?("/v1/host-native/work-plans")
          abort("Core host-native persistent store integration missing") unless
            core_app_source.include?("host-native-governance")
          abort("MCP continuity automation import missing") unless
            mcp_server_source.include?('import { createWorkContinuityAutomation } from "./work-continuity-automation.js"')
          abort("MCP continuity automation factory wiring missing") unless
            mcp_server_source.include?("createWorkContinuityAutomation({ runtime: workContinuityRuntime })")
          abort("MCP afterToolCall automation invocation missing") unless
            mcp_server_source.include?("await workContinuityAutomation(event)")
      - name: Validate Codex native-agent policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          config = tomllib.loads(Path(".codex/config.toml").read_text())
          assert config.get("sandbox_mode") == "workspace-write"
          assert config.get("approval_policy") == "on-request"
          assert config.get("approvals_reviewer") == "auto_review"
          assert config.get("features", {}).get("multi_agent") is True
          agents = config.get("agents", {})
          assert agents.get("enabled") is True
          assert agents.get("max_concurrent_threads_per_session") == 3
          assert "OPENAI_API_KEY" not in Path("AGENTS.md").read_text()
          PY
      - name: Validate caller-free closure contract
        run: |
          node --input-type=module <<'NODE'
          import {
            WORK_CONTINUITY_TOOLS,
          } from "./services/skinharmony-core-mcp/src/work-continuity-tools.js";

          const finalize = WORK_CONTINUITY_TOOLS.find(
            (tool) => tool.name === "work_continuity_closure_finalize",
          );
          if (!finalize) {
            throw new Error("work_continuity_closure_finalize_missing");
          }
          const actualProperties = Object.keys(finalize.inputSchema.properties).sort();
          const expectedProperties = [
            "action_ticket_id",
            "agent_id",
            "client_type",
            "idempotency_key",
            "plan_id",
            "session_id",
            "work_id",
          ].sort();
          if (JSON.stringify(actualProperties) !== JSON.stringify(expectedProperties)) {
            throw new Error(`closure_finalize_caller_fields_changed:${actualProperties.join(",")}`);
          }
          const expectedRequired = [
            "action_ticket_id",
            "idempotency_key",
            "plan_id",
            "work_id",
          ].sort();
          const actualRequired = [...finalize.inputSchema.required].sort();
          if (JSON.stringify(actualRequired) !== JSON.stringify(expectedRequired)) {
            throw new Error(`closure_finalize_required_fields_changed:${actualRequired.join(",")}`);
          }
          if (finalize.inputSchema.additionalProperties !== false) {
            throw new Error("closure_finalize_must_reject_unknown_fields");
          }
          NODE
      - name: Enforce host-native zero-provider boundary
        shell: ruby {0}
        run: |
          dedicated_files = [
            "services/skinharmony-core-mcp/src/host-native-health-contract.js",
            "services/skinharmony-core-mcp/src/host-native-tools.js",
            "services/skinharmony-core-mcp/src/work-continuity-automation.js",
            "services/skinharmony-core-mcp/src/work-continuity-runtime.js",
            "services/skinharmony-core-mcp/src/work-continuity-tools.js",
            "services/universal-core-service/src/boundedInternalCoordination.js",
            "services/universal-core-service/src/hostNativeGovernance.js",
            "services/universal-core-service/src/hostNativeExternalReadback.js",
            "services/universal-core-service/src/hostNativeResolverRegistry.js",
          ]
          missing = dedicated_files.reject { |path| File.file?(path) }
          abort("host-native implementation file missing: #{missing.join(", ")}") unless missing.empty?

          forbidden = {
            # Lower-case field names are allowed only so the native boundary
            # can reject them. The process-level provider credential is not.
            "OPENAI_API_KEY" => /OPENAI_API_KEY/,
            "OpenAI provider route" => %r{/providers/openai}i,
            "tenant provider tool" => /tenant_provider_openai/i,
            "Responses API" => %r{/v1/responses}i,
          }

          violations = []
          dedicated_files.each do |path|
            File.readlines(path).each_with_index do |line, index|
              forbidden.each do |label, pattern|
                violations << "#{path}:#{index + 1}: #{label}" if line.match?(pattern)
              end
            end
          end

          [
            "services/skinharmony-core-mcp/src/server.js",
            "services/skinharmony-core-mcp/src/core-handlers.js",
          ].each do |integration_path|
            integration_lines = File.readlines(integration_path)
            native_indices = integration_lines.each_index.select do |index|
              integration_lines[index].match?(/host_native_|work_continuity_(?:native|intent|atlas|incident|delegation|closure)/i)
            end
            native_indices.flat_map { |index| ((index - 8)..(index + 8)).to_a }
              .select { |index| index >= 0 && index < integration_lines.length }
              .uniq
              .each do |index|
                forbidden.each do |label, pattern|
                  if integration_lines[index].match?(pattern)
                    violations << "#{integration_path}:#{index + 1}: #{label} in host-native integration block"
                  end
                end
              end
          end

          abort("host-native provider tripwire failed:\n#{violations.uniq.join("\n")}") unless violations.empty?
      - name: Enforce native-only Nyra and MCP model boundary
        shell: ruby {0}
        run: |
          native_only_sources = [
            "services/skinharmony-core-mcp/src/config.js",
            "services/skinharmony-core-mcp/src/research-cortex.js",
            "personal-control-center/server.js",
          ]
          missing = native_only_sources.reject { |path| File.file?(path) }
          abort("native-only source missing: #{missing.join(', ')}") unless missing.empty?

          forbidden = {
            "server-side OpenAI credential" => /OPENAI_API_KEY/,
            "Responses API" => %r{https://api\.openai\.com/v1/responses}i,
            "server research execute tool" => /nyra_research_execute/,
          }
          violations = native_only_sources.flat_map do |path|
            File.readlines(path).each_with_index.filter_map do |line, index|
              match = forbidden.find { |_label, pattern| line.match?(pattern) }
              "#{path}:#{index + 1}: #{match[0]}" if match
            end
          end
          retired_files = [
            "services/universal-core-service/src/tenantOpenAiMultiAgentRunner.js",
            "services/universal-core-service/test/tenant-openai-multi-agent-runner.test.js",
            "services/universal-core-service/test/tenant-openai-multi-agent-api.test.js",
          ]
          revived = retired_files.select { |path| File.exist?(path) }
          failures = violations + revived.map { |path| "retired file restored: #{path}" }
          abort("native-only provider boundary failed:\n#{failures.join("\n")}") unless failures.empty?
      # Root postinstall builds both Render Rust artifacts once.
      - name: Install root deployment dependencies and artifacts
        run: npm ci
      - name: Verify Core MCP Render runtime dependency boundary
        run: node -e "import('./services/universal-core-service/src/softwareCognition.js')"
      - name: Install Universal Core locked dependencies
        run: npm ci --ignore-scripts --prefix services/universal-core-service
      - name: Test Generic Work Core Join remote signer worker
        run: npm run github:standing-release-worker:test
      - name: Verify exact Nyra Deep V2 runtime artifacts
        run: npm run nyra:deep-v2:runtime:verify
      - name: Test shared service contracts
        run: node --test services/shared/test/*.test.js
      - name: Test Core Policy Registry compiler provenance integration
        run: >-
          node --test
          services/universal-core-service/test/nyra-policy-registry-compiler-provenance.test.js
          services/universal-core-service/test/nyra-policy-registry-api.test.js
          services/universal-core-service/test/nyra-policy-registry-coordinator.test.js
          services/universal-core-service/test/nyra-policy-registry-proof-service.test.js
          services/universal-core-service/test/nyra-policy-registry.test.js
      - name: Test Policy Registry MCP configuration bridge and readiness
        run: >-
          node --test
          services/skinharmony-core-mcp/test/config.test.js
          services/skinharmony-core-mcp/test/policy-registry-lifecycle-bridge.test.js
          services/skinharmony-core-mcp/test/policy-registry-lifecycle-readiness.test.js
      - name: Test host-native resolver registry
        run: >-
          node --test
          services/universal-core-service/test/host-native-resolver-registry.test.js
      - name: Behaviorally prove host-native zero-provider execution
        env:
          # A configured provider credential must never activate the native path.
          OPENAI_API_KEY: ci-poison-provider-key-must-never-be-used
        run: |
          node --input-type=module <<'NODE'
          let outboundFetchCalls = 0;
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (...args) => {
            outboundFetchCalls += 1;
            throw new Error(`host_native_unexpected_fetch:${String(args[0] || "")}`);
          };

          try {
            const [
              { buildIntentAnchor, buildNativeAgentPlan },
              { buildHostNativeWorkPlan },
            ] = await Promise.all([
              import("./services/skinharmony-core-mcp/src/work-continuity-runtime.js"),
              import("./services/universal-core-service/src/hostNativeGovernance.js"),
            ]);

            const requiredChecks = [
              "core-mcp",
              "deployment-parity",
              "universal-core",
            ];
            const mcpPlan = buildNativeAgentPlan({
              host_type: "codex_native",
              required_checks: requiredChecks,
              tasks: [
                {
                  task_id: "builder",
                  kind: "builder",
                  instruction: "Implement the bounded host-native change.",
                },
                {
                  task_id: "verifier",
                  kind: "verifier",
                  instruction: "Independently verify the bounded change.",
                  dependencies: ["builder"],
                },
              ],
              max_parallel: 2,
            });
            const anchor = buildIntentAnchor({
              project_id: "continuity-ci",
              session_id: "zero-provider-spy",
              initial_message: "Plan and preserve this bounded host-native work.",
              idea: "Native ChatGPT and Codex agents only.",
              objective: "Prove planning and continuity do not invoke a provider.",
              acceptance_criteria: ["zero outbound fetch calls"],
              constraints: ["no provider execution"],
              host_type: "codex_native",
            });
            const corePlan = buildHostNativeWorkPlan({
              tenant_id: "codexai",
              work_id: "continuity-ci",
              intent_anchor_digest: anchor.intent_digest,
              repository: "cardarellocristian86-debug/skinharmony-ai-backend",
              objective: "Plan and verify the bounded host-native CI work.",
              required_checks: requiredChecks,
              agents: [
                {
                  agent_id: "builder",
                  role: "builder",
                  task: "Implement the bounded host-native change.",
                  depends_on: [],
                  capabilities: ["workspace_write"],
                },
                {
                  agent_id: "verifier",
                  role: "verifier",
                  task: "Independently verify the bounded change.",
                  depends_on: ["builder"],
                  capabilities: ["workspace_read"],
                },
              ],
              max_parallel: 2,
            });

            if (
              mcpPlan.provider_execution !== false ||
              mcpPlan.provider_api_key_required !== false ||
              corePlan.provider_execution !== false ||
              corePlan.provider_api_key_required !== false ||
              corePlan.server_model_calls !== 0
            ) {
              throw new Error("host_native_zero_provider_contract_failed");
            }
            if (outboundFetchCalls !== 0) {
              throw new Error(`host_native_outbound_fetch_detected:${outboundFetchCalls}`);
            }

            // Full suites below also execute the durable contract tests in:
            // - services/skinharmony-core-mcp/test/work-continuity-fabric-v2.test.js
            // - services/universal-core-service/test/host-native-governance.test.js
          } finally {
            globalThis.fetch = originalFetch;
          }
          NODE
      - name: Exercise PostgreSQL 16 continuity fabric
        env:
          WORK_CONTINUITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          services/skinharmony-core-mcp/test/work-continuity-postgres16.test.js
      - name: Exercise PostgreSQL 16 Research Airlock replay gate
        env:
          RESEARCH_AIRLOCK_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          services/universal-core-service/test/research-airlock-postgres16.test.js
      - name: Exercise PostgreSQL 16 NSCT and signed pre-Core gate
        env:
          SOFTWARE_COGNITION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          services/universal-core-service/test/software-cognition-postgres16.test.js
      - name: Exercise PostgreSQL 16 Entity 360 isolation and concurrency gate
        env:
          ENTITY360_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          services/universal-core-service/test/entity360-postgres16.test.js
          services/universal-core-service/test/icf-event-digest-postgres16.test.js
      - name: Exercise PostgreSQL 16 Core Policy Registry proof and lifecycle gate
        env:
          POLICY_REGISTRY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          services/universal-core-service/test/nyra-policy-registry-postgres16.test.js
      - name: Test Nyra Policy Registry attestation and exact S2S route
        run: >-
          node --test
          personal-control-center/test/nyra-policy-registry-attestation.test.js
          personal-control-center/test/nyra-policy-registry-attestation-route.test.js
      - name: Exercise PostgreSQL 16 Nyra Policy Registry replay gate
        env:
          NYRA_POLICY_REGISTRY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/continuity_ci
        run: >-
          node --test
          personal-control-center/test/nyra-policy-registry-attestation-postgres16.test.js
      - name: Test Universal Core from root install
        run: |
          node --test \
            services/universal-core-service/test/bootstrap-required-checks-readback.test.js \
            services/universal-core-service/test/host-native-governance.test.js \
            services/universal-core-service/test/host-native-resolver-registry.test.js \
            services/universal-core-service/test/nyra-work-automation-*.test.js
      - name: Test Core MCP from root install
        run: npm run core:mcp:test

  smartdesk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartdesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartdesk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: smartdesk-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: smartdesk-live/package-lock.json
      - run: npm ci
      - run: npm run test:persistence-p0
      - run: npm run test:external-ai-gold
      - run: npm run test:semantic-selection
      - run: npm run test:cockpit-360-e2e
      - run: npm run test:enterprise
      - run: npm run test:gold-18m
      - run: npm run test:gold-overview
      - run: npm run test:gold-bridge-cache
      - run: npm run test:gold-conversation-demand
      - run: npm run test:hardening
      - run: npm run test:postgres
        env:
          SMARTDESK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/smartdesk_ci
      - run: npm run test:reality-closure
      - run: npm run audit:gold
